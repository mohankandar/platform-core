# Texts of these platform codes (PlatformCode, platform-errors). Never a secret, token, document content or value.
MOD_SETTINGS_INVALID.kind=REFUSED
MOD_SETTINGS_INVALID.message=The application did not start: its model governance settings are not complete. IT has the details.
MOD_SETTINGS_INVALID.cause=A platform.model-governance.* setting is missing or not valid, or a bean model governance needs is missing; the start-up message lists every problem.
MOD_SETTINGS_INVALID.fix=Correct each platform.model-governance.* setting or add each bean the start-up message names (docs/install/model-governance.md), then start the app again.
MOD_SETTINGS_INVALID.support=The app refuses to start until its model governance settings are complete; ask the customer's IT for the start-up message.
