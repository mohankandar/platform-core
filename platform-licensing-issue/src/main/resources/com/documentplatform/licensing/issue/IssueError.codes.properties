# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.message=The licence was not issued.
*.fix=Correct what the message names and run the licence-issuing command again (docs/install/licence-signing.md).
*.support=Internal: the licence-issuing command (our side) refused; the operator corrects the input or Vault and runs it again.
ISSUE_RECORDS_UNREADABLE.kind=FAILED
ISSUE_RECORDS_UNWRITABLE.kind=FAILED
ISSUE_OUTPUT_UNWRITABLE.kind=FAILED
ISSUE_KEY_UNAVAILABLE.kind=FAILED
ISSUE_VAULT_UNREACHABLE.kind=FAILED
ISSUE_VAULT_TLS.kind=FAILED
ISSUE_VAULT_SEALED.kind=FAILED
ISSUE_VAULT_ERROR.kind=FAILED
ISSUE_SIGNATURE_MISMATCH.kind=FAILED
ISSUE_VAULT_*.fix=Check Vault: reachable at the configured address, unsealed, the login and the Transit policy for the signing key (docs/install/licence-signing.md).

# ---- per code
ISSUE_BAD_OPTION.cause=An option is unknown, repeated or has a value of the wrong shape.
ISSUE_MISSING_OPTION.cause=A required option is missing.
ISSUE_INVALID_LICENCE.cause=The options do not make a valid licence.
ISSUE_INSTALL_TOO_LONG.cause=An install licence runs for at most 60 days.
ISSUE_UNKNOWN_TENANT.cause=The tenant ID given is not in the issued records.
ISSUE_TENANT_CUSTOMER_MISMATCH.cause=The tenant ID given was issued to a different customer.
ISSUE_TENANT_KIND_MISMATCH.cause=Non-production tenants and production/install tenants never share IDs.
ISSUE_UNKNOWN_SLOT.cause=A slot ID given was not issued to this tenant.
ISSUE_ID_COLLISION.cause=No unused ID could be generated.
ISSUE_RECORDS_UNREADABLE.cause=The issued-records file cannot be read.
ISSUE_RECORDS_UNWRITABLE.cause=The issued-records file cannot be written.
ISSUE_OUTPUT_EXISTS.cause=The output licence file already exists; it is never overwritten.
ISSUE_OUTPUT_UNWRITABLE.cause=The licence file cannot be written.
ISSUE_KEY_NOT_FOUND.cause=The signer has no signing key (or no such key version) under this key ID.
ISSUE_KEY_INVALID.cause=The key under this key ID is not an Ed25519 signing key.
ISSUE_KEY_UNAVAILABLE.cause=The signer failed in an unexpected way.
ISSUE_KEY_EXPORTABLE.cause=The Vault key allows export or plaintext backup, so its private key could leave Vault; it is not used.
ISSUE_SIGNATURE_MISMATCH.cause=The signature returned does not verify with the key's public key; nothing was written.
ISSUE_VAULT_NO_TOKEN.cause=No Vault credentials: VAULT_TOKEN is not set and no --vault-login was given.
ISSUE_VAULT_LOGIN_REFUSED.cause=Vault refused the login (wrong user name or password, or the user is disabled).
ISSUE_VAULT_PERMISSION_DENIED.cause=Vault refused the request: the token does not carry the licensing-signer policy, or has expired.
ISSUE_VAULT_UNREACHABLE.cause=Vault could not be reached at the address given (connection refused, timeout or unknown host).
ISSUE_VAULT_TLS.cause=The TLS connection to Vault failed: its certificate is not trusted by this Java runtime.
ISSUE_VAULT_SEALED.cause=Vault answered HTTP 503: it is sealed or not yet ready, and cannot sign until it is unsealed and ready.
ISSUE_VAULT_ERROR.cause=Vault answered with an error or a reply this command does not understand, or a standby node redirected the request to the active node (redirects are not followed: use the active node's address).
