# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=FAILED
*.message=The application cannot start: its database is not ready. IT has been told.
*.support=The app's database was not prepared for this release. Ask the customer's IT to run the schema step named in the app's log (the install guide says how), then start the app.
IDN_TABLES_MISSING.fix=Run the identity schema step (Flyway location db/platform/identity) as the schema owner, then start the app.
IDN_TABLES_INCOMPLETE.fix=Restore the missing tables by running the identity schema step again on a database where they exist, or restore the database; never create them by hand.
IDN_VERSION_UNKNOWN.fix=Check the identity version table was not emptied or dropped; run the identity schema step.
IDN_VERSION_UNKNOWN.cause=Some tables exist but the version table is missing or empty.
IDN_VERSION_OLDER.fix=Run the identity schema step of this release (Flyway location db/platform/identity), then start the app.
IDN_VERSION_NEWER.fix=Install the app release that matches the database, or restore the database from before the upgrade.
IDN_PRIVILEGES_MISSING.fix=Grant the app's database user the rights the install guide lists on the identity tables (SELECT, INSERT, UPDATE, DELETE; SELECT on the version table).
IDN_CHECK_FAILED.fix=Check the database is reachable and the app's user may read the system catalogue; the SQL state in the log says why the check was refused.
IDN_TABLES_MISSING.cause=None of the identity tables exist: the schema step was never run on this database schema.
IDN_TABLES_INCOMPLETE.cause=The version is right but some identity tables are missing.
IDN_VERSION_OLDER.cause=The identity tables are older than the code: the schema step for this release was not run.
IDN_VERSION_NEWER.cause=The identity tables are newer than the code: an older app release runs against an upgraded database.
IDN_PRIVILEGES_MISSING.cause=The app's database user may not read or write a identity table.
IDN_CHECK_FAILED.cause=The database refused the identity check itself.

