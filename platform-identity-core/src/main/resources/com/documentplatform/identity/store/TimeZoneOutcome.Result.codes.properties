# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.message=The time zone could not be set. The screen says why.
*.fix=Choose a time zone from the list (an IANA name such as Europe/Paris).
*.support=Ask the customer's admin to pick the time zone from the list.
SET.kind=INFO
CLEARED.kind=INFO
UNCHANGED.kind=INFO
SET.fix=Nothing to do.
CLEARED.fix=Nothing to do.
UNCHANGED.fix=Nothing to do.
SLOT_UNKNOWN.fix=Run the setup command so the slot is stored, or check the slot ID.
CUSTOMER_UNKNOWN.fix=Run the setup command first; it stores the customer from the licence.

# ---- per code
SET.cause=The zone is now the one given.
CLEARED.cause=The entity has no zone of its own any more: it follows the customer's.
UNCHANGED.cause=It was already so; nothing changed.
NOT_AN_ID.cause=Not a slot ID (ENT-…) or tenant ID (TEN-…).
TIME_ZONE_INVALID.cause=Not an IANA time zone name such as America/New_York (offsets like +05:00 are not taken).
SLOT_UNKNOWN.cause=The setup command has not stored the slot.
CUSTOMER_UNKNOWN.cause=The setup command has not stored the customer.
