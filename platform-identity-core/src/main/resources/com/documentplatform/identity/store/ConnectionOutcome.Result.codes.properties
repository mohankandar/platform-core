# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.message=The login connection could not be changed. The screen says why.
*.fix=Nothing to do.
*.support=Ask the customer's IT Admin to read the message on the login-connection screen (identity install guide, section 6).
DRAFT_CREATED.kind=INFO
DRAFT_UPDATED.kind=INFO
UNCHANGED.kind=INFO
VALIDATED.kind=INFO
ACTIVATED.kind=INFO
ROLLED_BACK.kind=INFO
DRAFT_DISCARDED.kind=INFO
DRAFT_CREATED.message=Draft created.
DRAFT_UPDATED.message=Draft saved.
UNCHANGED.message=Nothing changed.
VALIDATED.message=The test sign-in passed.
ACTIVATED.message=The new login connection is active.
ROLLED_BACK.message=The previous login connection is active again.
DRAFT_DISCARDED.message=Draft discarded.
IDN_TEST_FAILED.fix=Read the test's failure code (IDN_TEST_...) and correct the draft.
IDN_DRAFT_EXISTS.fix=Continue with the existing draft, or discard it first.
IDN_VERSION_CONFLICT.fix=Reload the screen and make the change again.
IDN_VERSION_CONFLICT.message=Someone else changed this login connection meanwhile. Reload it and try again.
IDN_CONNECTION_UNKNOWN.fix=Reload the screen; the connection may have been removed.
IDN_NOT_A_DRAFT.fix=Start a draft first; only a draft can be edited or tested.
IDN_NOT_VALIDATED.fix=Run the test sign-in on the draft first; only a validated draft can be activated.
IDN_NO_PREVIOUS_CONNECTION.fix=There is no earlier active connection to go back to; correct the current one with a new draft.
IDN_HTTP_ISSUER_NOT_ALLOWED.fix=Use the login system's https address; http is only for a test login server on this machine under a development licence.
IDN_VALUES_REQUIRED.fix=Fill in the provider, issuer and API audience.
IDN_VALUES_INVALID.fix=Correct the value named in the message.
IDN_CUSTOMER_UNKNOWN.fix=Run the setup command first; it stores the customer from the licence.

# ---- per code
DRAFT_CREATED.cause=A new DRAFT: a copy of the ACTIVE connection, or the first connection.
DRAFT_UPDATED.cause=The draft has the new values; it is DRAFT again (a VALIDATED one must be tested again).
UNCHANGED.cause=The draft already had these values; nothing changed.
VALIDATED.cause=The test sign-in passed: the draft is VALIDATED and may be activated.
ACTIVATED.cause=The draft is ACTIVE; the connection ACTIVE before is DISABLED.
ROLLED_BACK.cause=The previous ACTIVE version is ACTIVE again, as a new version.
DRAFT_DISCARDED.cause=The draft was dropped (DISABLED, kept in the history).
IDN_TEST_FAILED.cause=The test sign-in failed (its report names the check that failed); the draft is (again) DRAFT.
IDN_DRAFT_EXISTS.cause=The customer already has a DRAFT or VALIDATED connection for the product (at most one).
IDN_VERSION_CONFLICT.cause=The version given is not the stored one: someone changed the connection first. Reload and try again.
IDN_CONNECTION_UNKNOWN.cause=No such connection for this customer and product.
IDN_NOT_A_DRAFT.cause=The connection is not a DRAFT or VALIDATED one (it is ACTIVE or DISABLED).
IDN_NOT_VALIDATED.cause=Only a VALIDATED connection can be activated: run the test sign-in first.
IDN_NO_PREVIOUS_CONNECTION.cause=There is no previous ACTIVE version to go back to.
IDN_HTTP_ISSUER_NOT_ALLOWED.cause=An http issuer: allowed only on localhost, 127.0.0.1 or [::1] under a licence signed by a development key.
IDN_VALUES_REQUIRED.cause=There is no ACTIVE connection to copy: give the first connection's values.
IDN_VALUES_INVALID.cause=A value is missing or not valid (the message names the field).
IDN_CUSTOMER_UNKNOWN.cause=The setup command has not stored the customer yet.
IDN_TEST_SIGN_IN_REQUIRED.cause=The draft would replace the active connection, but no test sign-in with a real token has passed for this version of it; nothing was switched.
IDN_TEST_SIGN_IN_REQUIRED.fix=Sign in at the new login system with a test user, run the draft's test sign-in with that token, then activate.
