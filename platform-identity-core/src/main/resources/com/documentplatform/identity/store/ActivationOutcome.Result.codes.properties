# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.message=The entity could not be changed. The screen says why.
*.fix=Read the message on the entities screen; see the identity install guide, section 4.
*.support=Ask the customer's Business Admin to read the message on the entities screen.
ACTIVATED.kind=INFO
RENAMED.kind=INFO
UNCHANGED.kind=INFO
SUSPENDED.kind=INFO
RESUMED.kind=INFO
ACTIVATED.fix=Nothing to do.
RENAMED.fix=Nothing to do.
UNCHANGED.fix=Nothing to do.
SUSPENDED.fix=Nothing to do.
RESUMED.fix=Nothing to do.
RENAMED.cause=The entity has its new name.
NOT_A_SLOT_ID.cause=The value is not an entity slot ID (ENT- followed by capitals, digits and dashes).
NAME_INVALID.cause=The name is empty, longer than 200 characters, or holds control characters.
ALREADY_ACTIVATED.cause=The slot is already activated.
NO_LICENCE.fix=Install the licence with the setup or licence command.
LICENCE_EXPIRED.fix=Install a renewed licence.
LICENCE_NOT_STARTED.fix=Wait until the licence's start date, or install a licence that has started.
NOT_IN_LICENCE.fix=Ask your account manager for a licence that includes this slot.
NAME_TAKEN.fix=Choose another name; names are unique within the customer, ignoring case.

# ---- per code
ACTIVATED.cause=The slot is now ACTIVE with the name. The app creates its own entity row with the entity UUID.
UNCHANGED.cause=The name was already this one.
SUSPENDED.cause=The slot is now SUSPENDED: still activated, but nobody may sign in to it.
RESUMED.cause=The slot is ACTIVE again.
ALREADY_SUSPENDED.cause=Suspend of a slot that is already SUSPENDED; nothing changed.
NOT_SUSPENDED.cause=Resume of a slot that is already ACTIVE; nothing changed.
NO_LICENCE.cause=No valid licence is in force, so nothing can be activated.
LICENCE_EXPIRED.cause=The licence in force expired and its grace period is over (the same rule as intake).
LICENCE_NOT_STARTED.cause=The licence in force has not started yet (the same rule as intake).
NOT_IN_LICENCE.cause=The licence in force does not list the slot.
SLOT_UNKNOWN.cause=The setup command has not stored the slot yet.
NOT_ACTIVATED.cause=Rename, suspend or resume of a slot that is not activated.
NAME_TAKEN.cause=Another entity of the customer has this name (names are compared ignoring case).
