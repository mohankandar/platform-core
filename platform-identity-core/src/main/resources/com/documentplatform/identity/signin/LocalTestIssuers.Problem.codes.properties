# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.message=This login system address cannot be used.
*.support=Ask the customer's IT to use the login system's https address.
NOT_AN_ISSUER.fix=Give the issuer as an absolute https address.
HTTP_NOT_ALLOWED.fix=Use the login system's https address; http only for a login server on this machine under a development licence.

# ---- per code
NOT_AN_ISSUER.cause=Not an absolute https (or http) address with a host, or it has a query, fragment or user part.
HTTP_NOT_ALLOWED.cause=http, but not on this machine or not under a development licence.
