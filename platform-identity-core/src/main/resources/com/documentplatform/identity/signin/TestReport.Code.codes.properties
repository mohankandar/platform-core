# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.message=The test sign-in did not pass. The screen names what to correct.
*.support=Ask the customer's IT Admin to read the failure on the login-connection screen; the identity install guide (section 6) says what each one means.
IDN_TEST_ISSUER_UNREACHABLE.kind=FAILED
IDN_TEST_ISSUER_UNREACHABLE.fix=Check the issuer address and that this server can reach it (the reason code says why: OUT_TLS_FAILED, OUT_ADDRESS_BLOCKED, HTTP_404, ...; platform.outbound.*).
IDN_TEST_DISCOVERY_MISMATCH.fix=Copy the issuer address exactly as the login system's discovery document names it.
IDN_TEST_KEYS_MISSING.fix=Check the login system publishes its signing keys (jwks_uri) and this server can reach them.
IDN_TEST_TOKEN_UNREADABLE.fix=Paste the whole signed token (three parts separated by dots).
IDN_TEST_TOKEN_SIGNATURE.fix=Use a token from this login system; check the issuer address.
IDN_TEST_TOKEN_ISSUER.fix=Use a token from the issuer of this connection.
IDN_TEST_AUDIENCE.fix=Have the login system issue the token for the product's API audience, or correct the audience in the draft.
IDN_TEST_EXPIRED.fix=Get a fresh token; check this server's clock.
IDN_TEST_GROUPS_CLAIM_MISSING.fix=Set the login system to send the groups claim in the product's tokens.

# ---- per code
IDN_TEST_ISSUER_UNREACHABLE.cause=The issuer's discovery document could not be fetched (connection, outbound rule, or an HTTP error). The report's reason says why; it is a reason under this code, not a code of its own: an outbound code (OUT_TLS_FAILED, OUT_ADDRESS_BLOCKED, ...), HTTP_<status>, FETCH_FAILED (no answer could be read) or TOO_LARGE (the answer was over the size limit).
IDN_TEST_DISCOVERY_MISMATCH.cause=The discovery document is not valid JSON, or its issuer is not exactly the connection's issuer.
IDN_TEST_KEYS_MISSING.cause=No jwks_uri, the key set could not be fetched, or it holds no usable signing key.
IDN_TEST_TOKEN_UNREADABLE.cause=The pasted text is not a signed JWT (three parts, readable header and claims).
IDN_TEST_TOKEN_SIGNATURE.cause=The token's signature does not verify with the issuer's keys (or its algorithm is not accepted).
IDN_TEST_TOKEN_ISSUER.cause=The token's iss is not the connection's issuer.
IDN_TEST_AUDIENCE.cause=The token's aud does not name the API audience the product expects.
IDN_TEST_EXPIRED.cause=The token has expired, is not valid yet, or has no expiry.
IDN_TEST_GROUPS_CLAIM_MISSING.cause=The token has no groups claim (under the claim name the app reads).
