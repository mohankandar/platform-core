# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.http=403
*.message=The calling system is not allowed to send to this API.
*.support=The sending system is not set up for this customer. Ask the customer's IT for the code and reference; the identity install guide (section 9, "Push-API callers") says what to change.
IDN_PUSH_NO_CONNECTION.fix=Check the issuer of the sending system's token and that the login connection for the product is active.
IDN_PUSH_AUDIENCE.fix=Have the login system issue the sending system's tokens for the product's API audience.
IDN_PUSH_NO_CLIENT_ID.fix=Check platform.identity.push.client-id-claims matches the claim your login system puts the client ID in.
IDN_PUSH_NOT_BOUND.fix=Add the client ID's line to the client-binding file and run setup.
IDN_PUSH_BINDING_OFF.fix=Add the client's line back to the client-binding file and run setup, if the system should send again.
IDN_PUSH_ENTITY_NOT_ACTIVE.fix=Have the Business Admin activate or resume the entity.
IDN_PUSH_CLAIM_MISMATCH.fix=Correct the binding in the client-binding file, or the entity or source claim in the sending system's token.
IDN_PUSH_CERT_NOT_BOUND.fix=Add a cert-sha256: line with the certificate's fingerprint to the client-binding file and run setup.
IDN_PUSH_TOKEN_AND_CERT_DIFFER.fix=Bind the token's client ID and the certificate's fingerprint to the same entity and source.

# ---- per code
IDN_PUSH_NO_CONNECTION.cause=No ACTIVE login connection for this product has the token's issuer (or, for a certificate, the customer).
IDN_PUSH_AUDIENCE.cause=The token's audiences do not include the connection's API audience.
IDN_PUSH_NO_CLIENT_ID.cause=None of the configured client ID claims is in the token (or no token where one is required).
IDN_PUSH_NOT_BOUND.cause=The client ID has no binding for this product under the connection's customer.
IDN_PUSH_BINDING_OFF.cause=The client's (or the certificate's) binding is switched off.
IDN_PUSH_ENTITY_NOT_ACTIVE.cause=The bound entity is not ACTIVE (not activated, suspended or no longer in the licence).
IDN_PUSH_CLAIM_MISMATCH.cause=A configured entity or source claim is in the token and differs from the binding.
IDN_PUSH_CERT_NOT_BOUND.cause=The certificate's fingerprint has no binding for this product (or no certificate where one is required).
IDN_PUSH_TOKEN_AND_CERT_DIFFER.cause=The token and the certificate point to different bindings (another customer, entity or source).
IDN_PUSH_NOT_MACHINE.cause=The token is a person's, not a machine's: it carries a claim only a person's sign-in has (for example email, name, groups, auth_time), or it lacks the product's configured machine claim. A person can never be a push-API caller.
IDN_PUSH_NOT_MACHINE.fix=Have the sending system sign in as a client (OAuth 2.0 client credentials) of its own, not through a person's sign-in. If your login system puts one of these claims into its machine tokens, set platform.identity.push.user-claims to the claims that mark a person there (docs/install/identity.md, section 9).
