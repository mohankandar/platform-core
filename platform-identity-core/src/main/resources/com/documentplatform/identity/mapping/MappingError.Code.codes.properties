# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.message=The role mapping file has errors and was not loaded. Nothing was changed.
*.fix=Correct the role mapping file at the line named (setup install guide, section 3) and run setup again.
*.support=Ask the customer's IT to correct the role mapping file at the lines setup listed, then run setup again.
NOT_UTF8.cause=The file is not UTF-8 text.
NOT_UTF8.fix=Save the file as "CSV UTF-8".
BAD_QUOTES.cause=A quoted value is not closed, or a quote is in the middle of a value.
VALUE_SPANS_LINES.cause=A value goes over more than one line.
UNSUPPORTED_FORMAT.cause=The # Format: comment names another format than this version reads.
UNSUPPORTED_FORMAT.fix=Use the format named in the message (platform-role-mapping/1).
BAD_HEADER.cause=The first line is not exactly entity_id,entity_name,group,role.
WRONG_COLUMN_COUNT.cause=A line does not have exactly four values.
BLANK_VALUE.cause=A value that must be filled in is empty.
INVISIBLE_CHARACTER.cause=A value has a leading or trailing space, a non-breaking or zero-width space, or a control character.
NOT_AN_ENTITY_ID.cause=The entity_id is not an entity ID.
UNKNOWN_ENTITY.cause=The entity (or slot) does not exist in this installation or licence.
ENTITY_NOT_ACTIVE.cause=The entity is not active.
ENTITY_NAME_MISMATCH.cause=The entity_name does not match the entity's name (or a * row names an entity).
CONFLICTING_ENTITY_NAMES.cause=The same entity is given two different names in the file.
NO_ACTIVE_LOGIN_SYSTEM.cause=The entity has no active login system, so its grants could never apply.
UNKNOWN_ROLE.cause=The role is neither one of the product's roles nor an alias.
ROLE_NOT_WRITTEN_CANONICALLY.cause=The role is written with other capitals than the product's role.
PLATFORM_ROLE.cause=The role is the product's platform role, which this file never grants.
GROUP_TOO_LONG.cause=The group name is longer than 200 characters.
DUPLICATE_ROW.cause=The same row appears twice.
NO_ROWS.cause=The file has a header but no rows.
PLATFORM_ROLE_ON_ENTITY.cause=A platform role is granted on an entity's row.
PLATFORM_ROLE_ON_ENTITY.fix=Grant platform roles on a row with entity_id * (leave entity_name empty).
ENTITY_ROLE_PLATFORM_WIDE.cause=A row with entity_id * grants an entity role; only the product's platform roles are platform-wide.
ENTITY_ROLE_PLATFORM_WIDE.fix=Grant entity roles on each entity's row (ENT-...), not on a * row.

# ---- per code
SLOT_ID_REQUIRED.cause=The file names an entity by UUID where only slot IDs (ENT-…) are accepted.
SLOT_NOT_IN_LICENCE.cause=The slot is known, but the licence in force does not list it.
WRONG_PRODUCT.cause=A # Product: comment names another product than the one the file is read for.
