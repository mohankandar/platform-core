# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.message=The client-binding file has errors and was not loaded. Nothing was changed.
*.fix=Correct the client-binding file at the line named (setup install guide, section 3a) and run setup again.
*.support=Ask the customer's IT to correct the client-binding file at the lines setup listed, then run setup again.
NOT_UTF8.cause=The file is not UTF-8 text.
HEADER_WRONG.cause=The first line is not exactly client_id,entity_slot,source,description.
BAD_QUOTES.cause=A quoted value is not closed, or a quote is in the middle of a value.
WRONG_COLUMN_COUNT.cause=A line does not have exactly four values.
CLIENT_ID_INVALID.cause=The client ID is empty, too long, or has spaces, commas, quotes or control characters (or a cert-sha256: value is not 64 lowercase hex digits).
SLOT_INVALID.cause=The entity slot is not a slot ID (ENT-...).
SOURCE_INVALID.cause=The source is not a source key (lowercase letters, digits, dot, underscore, dash).
DESCRIPTION_INVALID.cause=The description is longer than 200 characters or has control characters.
SECRET_LIKE.cause=A value looks like a secret (a token, a key, a password); it is never repeated.
SECRET_LIKE.fix=Remove the secret from the file: only client IDs go there.
DUPLICATE_CLIENT_ID.cause=The client ID is on an earlier line too.
SLOT_UNKNOWN.cause=The entity slot is not in the customer's licence.
SOURCE_UNKNOWN.cause=The source is not listed under the product's sources in the sign-in file.
CLIENT_BOUND_ELSEWHERE.cause=The client is already bound to another entity or source.
CLIENT_BOUND_ELSEWHERE.fix=Remove its line and run setup, then add the new line and run setup again.

