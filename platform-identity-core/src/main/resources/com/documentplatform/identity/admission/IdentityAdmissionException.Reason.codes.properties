# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.http=403
*.message=You cannot sign in here. Ask your administrator to check your access.
*.fix=Check the person's groups in the login system against the role mapping file for the product, and that the entity and login connection are active; run setup after changing the file.
*.support=The person's account is not given access here. Ask the customer's IT to check the role mapping file for the person's groups.
CONTEXT_UNAVAILABLE.kind=FAILED
CONTEXT_UNAVAILABLE.http=503
CONTEXT_UNAVAILABLE.message=Sign-in is not available right now. Please try again in a few minutes.
CONTEXT_UNAVAILABLE.fix=Check the identity tables are reachable (database) and the app's log for the reference.
POLICY_UNAVAILABLE.kind=FAILED
POLICY_UNAVAILABLE.http=503
POLICY_UNAVAILABLE.message=Sign-in is not available right now. Please try again in a few minutes.
POLICY_UNAVAILABLE.fix=Check the identity tables are reachable (database) and the app's log for the reference.
AMBIGUOUS_SELECTION.message=Choose the organisation you want to work in.
AMBIGUOUS_SELECTION.fix=Nothing to fix: the person chooses an entity.
UNKNOWN_ROLE.fix=Correct the role in the role mapping file to one of the product's roles, and run setup.
PLATFORM_ROLE_IN_ENTITY_GRANT.fix=Grant the platform role on a row with entity_id * instead of an entity's row, and run setup.
ENTITY_ROLE_IN_PLATFORM_GRANT.fix=Give a * row only a platform role; grant entity roles per entity slot; run setup.
GROUPS_NOT_A_COLLECTION.fix=Set the login system to send the groups claim as a list.
NO_ADMISSION_POLICY.fix=Add the entity's grants to the role mapping file and run setup.
MACHINE_BINDING_NOT_UNIQUE.fix=Bind the client ID to exactly one entity in the client-binding file and run setup.

# ---- per code
NOT_ENABLED.cause=Shared-issuer selection is switched off, or connections are not persisted.
NO_VERIFIED_MEMBERSHIP.cause=The verified identity has no admissible entity.
MEMBERSHIP_NOT_BACKED.cause=A verified membership is not backed by an ACTIVE connection.
AMBIGUOUS_SELECTION.cause=More than one entity is admissible and none was chosen.
NOT_AUTHORIZED_FOR_ENTITY.cause=The chosen entity is not one the verified identity may enter.
INVALID_SELECTION.cause=The entity choice could not be read.
NO_ROLE_FOR_ENTITY.cause=The identity matched an entity's groups but no role resulted.
UNKNOWN_ROLE.cause=A grant names a role the product does not know.
INVALID_ROLE_GRANT.cause=A membership carries no role, or the platform role (checked by SharedIssuerPreflight).
ENTITY_ROLE_IN_PLATFORM_GRANT.cause=A platform-wide grant gives a role that is not one of the product's platform roles.
PLATFORM_ROLE_IN_ENTITY_GRANT.cause=A grant gives the product's platform role through an entity group.
GROUPS_NOT_A_COLLECTION.cause=The verified groups claim is not a list.
NO_ADMISSION_POLICY.cause=The entity has no group grants at all.
CONTEXT_UNAVAILABLE.cause=There is no verified issuer, or no audience is configured.
POLICY_UNAVAILABLE.cause=The grants or the ACTIVE entities could not be read from the product's store.
MACHINE_BINDING_NOT_UNIQUE.cause=A machine identity is bound to no entity, or to more than one.
