# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=FAILED
*.message=Sending to or receiving from the other system did not work this time. It is tried again automatically where it can be; IT has the details.
*.fix=Look up the code in the integrations install guide (docs/install/integration.md, "Codes you can see"), correct the integration's settings or the other system, then use the integration's Test action.
*.support=Ask the customer's IT for the code and reference; the install guide's code list says what they change. Nothing was lost: the app keeps the item until it is sent.

INT_SENT.kind=INFO
INT_SENT.message=Sent.
INT_SENT.fix=Nothing to do.
INT_ALREADY_RECEIVED.kind=INFO
INT_ALREADY_RECEIVED.message=The other system already had this; nothing was sent twice.
INT_ALREADY_RECEIVED.fix=Nothing to do.
INT_ACCEPTED.kind=INFO
INT_ACCEPTED.message=The other system accepted it and is still working on it.
INT_ACCEPTED.fix=Nothing to do; the app checks the status later.
INT_HEALTHY.kind=INFO
INT_HEALTHY.message=The connection to the other system works.
INT_HEALTHY.fix=Nothing to do.
INT_TEST_CHECKED.kind=INFO
INT_TEST_CHECKED.message=The test passed.
INT_TEST_CHECKED.fix=Nothing to do.
INT_BUSY.kind=INFO
INT_BUSY.fix=Nothing to do: the app waits as the other system asks and sends again. If it lasts, ask the other system's owner about their capacity.
INT_DESTINATION_BUSY.kind=INFO
INT_DESTINATION_BUSY.fix=Nothing to do now; if it lasts, ask the other system's owner about their capacity.
INT_REFUSED.kind=REFUSED
INT_REFUSED.message=The other system refused this item. A person needs to look at it.
INT_REFUSED.fix=Read the other system's own code in the result; correct the item or the integration's mapping, then send again.
INT_SIGN_IN_REFUSED.kind=REFUSED
INT_SIGN_IN_REFUSED.fix=Check the integration's sign-in settings and the secret in the secret store; ask the other system's owner whether the account is still allowed.
INT_SCAN_INFECTED.kind=NEEDS_PERSON
INT_SCAN_INFECTED.message=An incoming file was stopped by the virus scanner and set aside. IT has been told.
INT_SCAN_INFECTED.fix=Look at the file in the quarantine folder with your security team; tell the sending system's owner. Never release it into the app.
INT_WATCH_INCOMPLETE.kind=NEEDS_PERSON
INT_WATCH_INCOMPLETE.fix=Check with the sending system why the drop is incomplete; once its files are all there, it is taken on the next pass.
INT_WATCH_REFUSED.kind=NEEDS_PERSON
INT_WATCH_REFUSED.fix=Look at problem.json in the drop's _problem folder, correct the drop with the sending system, and drop it again.
INT_DISABLED.kind=REFUSED
INT_DISABLED.fix=Switch the integration on in the integration screens, if it should run.
INT_KIND_NOT_SUPPORTED.kind=REFUSED
INT_KIND_NOT_SUPPORTED.fix=Use an integration of the kind this action takes.
INT_SIGN_IN_NONE_NOT_ALLOWED.kind=REFUSED
INT_SIGN_IN_NONE_NOT_ALLOWED.fix=Give the integration a sign-in, or on premises set platform.outbound.allow-sign-in-none=true if your security policy allows calls without sign-in.
INT_SENSITIVE_FIELD_NOT_ALLOWED.kind=REFUSED
INT_SENSITIVE_FIELD_NOT_ALLOWED.fix=Add the field's key to the integration's allowed sensitive fields if it may be sent, or remove it from the mapping.
INT_FILE_TOO_LARGE.kind=REFUSED
INT_FILE_TOO_LARGE.fix=Raise the integration's largest-file limit if the other system takes larger files, or send the document another way.
INT_TOO_MANY_DOCUMENTS.kind=REFUSED
INT_TOO_MANY_DOCUMENTS.fix=Raise the integration's most-documents limit if the other system allows it.
INT_PACKAGE_TOO_LARGE.kind=REFUSED
INT_PACKAGE_TOO_LARGE.fix=Raise the integration's largest-package limit if the other system takes larger packages.
INT_ADDRESS_BLOCKED.kind=REFUSED
INT_ADDRESS_BLOCKED.fix=Use the other system's public or allowed address. On premises, internal addresses need platform.outbound.allow-internal-addresses=true; cloud metadata addresses are always refused.
INT_ADDRESS_NOT_SECURE.kind=REFUSED
INT_ADDRESS_NOT_SECURE.fix=Use the other system's https address; plain http is allowed only on premises with platform.outbound.allow-internal-addresses=true.
INT_CANT_CONNECT.cause=The connection to the other system could not be opened (refused or unreachable).
INT_CANT_CONNECT.fix=Check the integration's address, that the other system is running, and the firewall and proxy between them.
INT_HOST_UNKNOWN.cause=The other system's host name is not known to the name service.
INT_HOST_UNKNOWN.fix=Check the host name in the integration's address, and the name service (DNS) of this server.
INT_CONNECT_TIMEOUT.cause=The connection to the other system could not be opened within the connect timeout.
INT_CONNECT_TIMEOUT.fix=Check that the other system is reachable from this server (firewall, proxy); raise the connect timeout only if the network is known to be slow.
INT_TIMEOUT.fix=Check the other system's response time; raise the integration's read timeout if it is known to be slow. The item is sent again with the same idempotency key.
INT_TLS_FAILED.fix=Check the other system's certificate: trusted by this server (add your private CA with platform.outbound.private-ca-file), not expired, and naming the host in the address.
INT_PROXY_REFUSED.fix=Check the outbound proxy (platform.outbound.proxy.*) allows connections to the other system's address.
INT_SECRET_NOT_FOUND.cause=A secret reference in the integration or the proxy settings names nothing in the secret store.
INT_SECRET_NOT_FOUND.fix=Create the secret under that name in the secret store, or correct the reference.
INT_SECRET_UNAVAILABLE.cause=The secret store could not be read when the secret was needed.
INT_SECRET_UNAVAILABLE.fix=Check the secret store is reachable and the app's account may read it.
INT_CONTENT_UNREADABLE.fix=Check the app's document storage; the item is tried again.
INT_CONFIG_UNREADABLE.kind=FAILED
INT_CONFIG_UNREADABLE.message=This integration cannot be used right now. IT has the details.
INT_CONFIG_UNREADABLE.fix=The stored settings of the integration named in the message are damaged: restore the database from a backup, or save the integration again from its screen (a new version).
INT_CONFIG_UNREADABLE.support=The stored integration settings could not be read; ask the customer's IT for the code and reference.
INT_POLL_HANDLER_FAILED.fix=Look up the app's own failure in its log with the reference; the item stays at the source and is taken on the next pass.
INT_WATCH_HANDLER_FAILED.fix=Look up the app's own failure in its log with the reference; the drop was put back and is taken on the next pass.
INT_CONFIG_INVALID.kind=REFUSED
INT_CONFIG_INVALID.cause=The integration's configuration does not pass the save-time check.
INT_CONFIG_INVALID.fix=Open the integration in the integration screens; each problem is named there. Correct and save it.
INT_CONFIG_ADDRESS_INVALID.cause=The address is not an absolute http(s) address, or it points to a blocked address.
INT_CONFIG_ADDRESS_NOT_SECURE.cause=The address is plain http where only https is allowed.
INT_CONFIG_PLACEHOLDER_UNKNOWN.cause=A template uses a placeholder that does not exist.
INT_CONFIG_TEMPLATE_INVALID.cause=A template cannot be read (an unclosed brace or an unknown construct).
INT_CONFIG_BODY_NOT_JSON.cause=A JSON body template is not valid JSON.
INT_CONFIG_HEADER_INVALID.cause=A header name or value is not allowed (control characters, or not a header name).
INT_CONFIG_SIGN_IN_NONE_HOSTED.cause=Sign-in NONE is configured on the hosted service, where it is never allowed.
INT_CONFIG_SIGN_IN_NONE_OFF.cause=Sign-in NONE is configured but this installation does not allow it.
INT_CONFIG_RULE_INVALID.cause=A classification rule is not valid (status, code or outcome).
INT_CONFIG_STEPS_INVALID.cause=The steps are not valid (none, a duplicate name, or a step that uses a value no earlier step gives).
INT_CONFIG_VERSION_CONFLICT.kind=REFUSED
INT_CONFIG_VERSION_CONFLICT.cause=The integration was changed by someone else since it was opened.
INT_CONFIG_VERSION_CONFLICT.message=Someone else changed this integration meanwhile. Reload it and make your change again.
INT_CONFIG_VERSION_CONFLICT.fix=Reload the integration and make the change again.
INT_CONFIG_NOT_FOUND.kind=REFUSED
INT_CONFIG_NOT_FOUND.cause=No integration with this ID is stored.
INT_CONFIG_NOT_FOUND.fix=Check the integration's ID; it may have been removed.
INT_CONFIG_EXISTS.kind=REFUSED
INT_CONFIG_EXISTS.cause=An integration with this ID is already stored.
INT_CONFIG_EXISTS.fix=Change the existing integration instead of creating it again.
INT_CONFIG_SIGN_IN_NONE_WARNING.kind=INFO
INT_CONFIG_SIGN_IN_NONE_WARNING.fix=Confirm that calls without sign-in are allowed by your security policy; the choice is audited.

INT_CONFIG_*.kind=REFUSED
INT_CONFIG_*.message=This integration's settings cannot be saved as they are. The screen names what to correct.
INT_CONFIG_*.fix=Correct the setting named in the integration screens and save again (docs/install/integration.md).
INT_CONFIG_*.support=Ask the customer's IT to open the integration and read the problems listed; each names the setting to correct.
INT_PROFILE_*.kind=REFUSED
INT_PROFILE_*.message=The integration profile file cannot be used. IT has the details.
INT_PROFILE_*.fix=Ask the API's owner for a corrected profile file (format platform-integration-profile/1); the problem's JSON pointer names the place.
INT_PROFILE_*.support=The profile file comes from the other system's owner; ask the customer's IT to get a corrected one.
INT_CREDENTIAL_*.kind=REFUSED
INT_CREDENTIAL_*.message=The integration's client certificate cannot be used. IT has the details.
INT_CREDENTIAL_*.support=Ask the customer's IT to check the integration's client certificate (install guide, "Client certificates").
INT_CALLBACK_*.kind=REFUSED
INT_CALLBACK_*.fix=Check the calling system signs its callbacks with the shared secret and the current time, and sends each once.
INT_TOKEN_*.kind=REFUSED
INT_TOKEN_*.fix=Check the integration's token address, client ID and secret or certificate in the login system and in the secret store; then use the Test action.
INT_FOLDER_*.fix=Check the export folder or share: it exists, the app's service account may write to it, and it has space (install guide, "Folder export").
INT_WATCH_*.fix=Check the watched folder or share: it exists, the app's service account may read and move files in it (install guide, "Watched folder").
INT_POLL_*.fix=Check the source API's answer against its profile or the integration's poll settings; the cursor is kept and the next pass starts from it.
INT_STATUS_*.fix=Check the other system's status address and answer; the item stays pending and is checked again.
INT_SCAN_*.fix=Check the virus scanner is running and reachable (platform.integration.scanner.*); incoming files are held until it answers.

# ---- per code
INT_SENT.cause=Every step answered as expected.
INT_ALREADY_RECEIVED.cause=The destination already had it (a classification rule said so, for example a replay answer).
INT_REFUSED.cause=The destination refused the request (a 4xx other than sign-in); its own code is in the result.
INT_ADDRESS_NOT_FOUND.cause=404 without a destination code: the address or path is wrong, which is a set-up fault, not a refusal.
INT_REDIRECT_REFUSED.cause=The destination answered with a redirect; redirects are never followed.
INT_SIGN_IN_REFUSED.cause=The destination refused the sign-in (401 / 403).
INT_BUSY.cause=The destination is busy: wait (Retry-After when sent) and send less; no attempt used.
INT_OUTAGE.cause=The destination is down or failing (5xx not classed as busy).
INT_UNCLEAR_ANSWER.cause=A 2xx answer that could not be read as the configuration expects (a value missing, not JSON, too long).
INT_RESPONSE_TOO_LARGE.cause=The answer was larger than the integration's limit and was not read.
INT_UNEXPECTED_STATUS.cause=An answer with a status no rule covers.
INT_INTEGRITY_MISMATCH.cause=The destination returned another checksum or size than was sent for a document.
INT_DESTINATION_BUSY.cause=The health check says the destination is busy (for example 503 with a busy code or Retry-After): wait and send fewer at once; it is not down, and no attempt is used.
INT_TIMEOUT.cause=No answer within the read timeout. The request may have arrived: resend with the same idempotency key.
INT_CONNECTION_LOST.cause=The connection was lost before a full answer was read.
INT_TLS_FAILED.cause=The TLS handshake failed: certificate not trusted, host name not in the certificate, protocol refused.
INT_ADDRESS_BLOCKED.cause=The address resolves to a blocked address (cloud metadata, link-local; internal when hosted).
INT_PROXY_REFUSED.cause=The outbound proxy refused the connection.
INT_PROXY_SIGN_IN_REFUSED.cause=The outbound proxy asked for sign-in (407): the proxy user or password is wrong, or none is set.
INT_PROXY_SIGN_IN_REFUSED.fix=The outbound proxy refused the sign-in (407). Check the proxy user and the password in the secret store (platform.outbound.proxy.user, platform.outbound.proxy.password-secret).
INT_CREDENTIAL_FILE_INVALID.cause=The uploaded file is not a PKCS#12 or PEM file with one certificate and its private key (or it is too large).
INT_CREDENTIAL_FILE_INVALID.fix=The certificate file is not a PKCS#12 (.p12, .pfx) or PEM file holding the client certificate and its private key. Export the certificate together with its private key and upload it again.
INT_CREDENTIAL_PASSWORD_WRONG.cause=The PKCS#12 file's (or the keystore's) password is wrong, or the PEM key is encrypted.
INT_CREDENTIAL_PASSWORD_WRONG.fix=The password of the certificate file or keystore is wrong (a PEM private key must not be encrypted). Check the password, or export the key without a password as PEM.
INT_CREDENTIAL_KEY_MISMATCH.cause=The private key does not belong to the certificate.
INT_CREDENTIAL_KEY_MISMATCH.fix=The private key does not belong to the certificate. Upload the certificate with its own private key.
INT_CREDENTIAL_EXPIRED.cause=The certificate has expired.
INT_CREDENTIAL_EXPIRED.fix=The client certificate has expired. Upload the renewed certificate as the next one and switch to it.
INT_CREDENTIAL_NOT_YET_VALID.cause=The certificate is not valid yet.
INT_CREDENTIAL_NOT_YET_VALID.fix=The client certificate is not valid yet (its start date is in the future). Keep it as the next certificate and switch when it is valid.
INT_CREDENTIAL_MISSING.cause=Mutual TLS is configured, but there is no certificate (no current one; or no next one for a Test of next).
INT_CREDENTIAL_MISSING.fix=The integration signs in with a client certificate, but none is set. Upload one, or point to one in a keystore.
INT_CREDENTIAL_KEY_SERVICE_FAILED.cause=The key service could not seal or open the stored certificate.
INT_CREDENTIAL_KEY_SERVICE_FAILED.fix=The key service could not encrypt or decrypt the stored client certificate. Check the key service (its health), then try again.
INT_CREDENTIAL_REFUSED.cause=The destination refused the client certificate (a TLS alert: bad, unknown, expired or revoked certificate).
INT_CREDENTIAL_REFUSED.fix=The destination refused the client certificate. Check with its owner that they trust this certificate (subject, issuer and fingerprint as shown) and that it is not revoked.
INT_CREDENTIAL_KEYSTORE_UNREADABLE.cause=The keystore file cannot be read (missing, no permission) or is not a keystore.
INT_CREDENTIAL_KEYSTORE_UNREADABLE.fix=The keystore file cannot be read. Check the path and that the app's service account may read it.
INT_CREDENTIAL_ALIAS_NOT_FOUND.cause=The keystore has no entry with a private key under that alias.
INT_CREDENTIAL_ALIAS_NOT_FOUND.fix=The keystore has no private key entry under this alias. Check the alias (keytool -list shows them).
INT_CREDENTIAL_NEXT_EXISTS.cause=There is already a next certificate: switch to it or discard it first.
INT_CREDENTIAL_NO_NEXT.cause=There is no next certificate to switch to or to discard.
INT_CREDENTIAL_CONFLICT.cause=Someone else changed the certificates first: reload and try again.
INT_FOLDER_NOT_FOUND.cause=The target folder does not exist (or is not a folder).
INT_FOLDER_NOT_FOUND.fix=The export folder does not exist or is not a folder. Create it, or correct the folder in the integration's configuration.
INT_FOLDER_NO_PERMISSION.cause=The service account may not create folders or files in the target folder.
INT_FOLDER_NO_PERMISSION.fix=The app's service account may not write to the export folder. Give it the right to create, write, rename and delete folders and files there.
INT_FOLDER_LINK_REFUSED.kind=NEEDS_PERSON
INT_FOLDER_LINK_REFUSED.cause=A symbolic link, junction or other reparse point stands where the export expects its own package folder or file; it was not followed and nothing behind it was touched.
INT_FOLDER_LINK_REFUSED.fix=A link (symbolic link or junction) stands in the export folder where the app writes or removes its own package folders. Nothing behind it was touched. Remove the link, find out who made it, and allow only the app's service account to create entries in the export folder.
INT_FOLDER_FULL.cause=The disk or the account's quota is full.
INT_FOLDER_FULL.fix=The export folder's disk or quota is full.
INT_FOLDER_UNREACHABLE.cause=The network share cannot be reached.
INT_FOLDER_UNREACHABLE.fix=The export folder's network share cannot be reached (server down, share removed, network or sign-in problem).
INT_FOLDER_EXISTS_DIFFERENT.cause=A package folder of that name already exists with another manifest.
INT_FOLDER_EXISTS_DIFFERENT.fix=A package folder of this name already exists in the export folder with other content. Nothing was changed; remove or rename the old folder, or check the folder name template.
INT_FOLDER_WRITE_FAILED.cause=Writing failed for another reason; only the package's .partial folder was touched.
INT_FOLDER_WRITE_FAILED.fix=Writing to the export folder failed. Only the package's .partial folder was touched.
INT_POLL_ITEMS_MISSING.cause=The list answer has no array of items where the configuration says.
INT_POLL_ITEMS_MISSING.fix=The source's list answer has no list of items where the configuration expects it. Check the items pointer against the source's API.
INT_POLL_ITEM_ID_MISSING.cause=An item without a usable source item ID (missing, not a value, too long); it is reported and left alone.
INT_POLL_ITEM_ID_MISSING.fix=An item in the source's list has no usable ID where the configuration expects it. Check the item ID pointer against the source's API.
INT_POLL_NEXT_PAGE_INVALID.cause=The next page's cursor or address cannot be used (not a value, or an address on another host).
INT_POLL_NEXT_PAGE_INVALID.fix=The source gave a next page that cannot be followed (an address on another server, or a cursor that is not a value). Check the paging settings against the source's API.
INT_POLL_STORAGE_FAILED.cause=The downloaded document could not be kept in the temporary folder (full, no permission).
INT_POLL_STORAGE_FAILED.fix=A downloaded document could not be kept in the app's temporary folder. Check its free space and the service account's rights there.
INT_POLL_HANDLER_FAILED.cause=The app's intake handler failed (an error, not an answer): the pass stopped, nothing was acknowledged.
INT_WATCH_ROOT_NOT_FOUND.cause=The watched folder does not exist (or is not a folder).
INT_WATCH_ROOT_NOT_FOUND.fix=The watched folder does not exist or is not a folder. Create it, or correct the folder in the integration's configuration.
INT_WATCH_NO_PERMISSION.cause=The service account may not read, create, rename or delete in the watched folder.
INT_WATCH_NO_PERMISSION.fix=The app's service account may not work in the watched folder. Give it the right to list, read, create, rename and delete folders and files there.
INT_WATCH_LINK_REFUSED.kind=NEEDS_PERSON
INT_WATCH_LINK_REFUSED.cause=A symbolic link, junction or other reparse point stands where the watched folder expects its own folder or file (_processing, _archive, _problem, _quarantine, a claim or its marker); it was not followed and nothing behind it was touched.
INT_WATCH_LINK_REFUSED.fix=A link (symbolic link or junction) stands in the watched folder where the app keeps its own folders (_processing, _archive, _problem, _quarantine) or a claimed drop. Nothing behind it was touched. Remove the link, find out who made it, and allow senders to create drops only.
INT_WATCH_SHARE_UNREACHABLE.cause=The network share cannot be reached (before or during a pass).
INT_WATCH_SHARE_UNREACHABLE.fix=The watched folder's network share cannot be reached (server down, share removed, network or sign-in problem). Drops already claimed are released by themselves after the claim time.
INT_WATCH_TRIGGER_UNREADABLE.cause=The trigger file cannot be read: malformed JSON or XML, too large, too deep, or a DTD or entity in XML.
INT_WATCH_TRIGGER_UNREADABLE.fix=The drop's trigger file cannot be read (it is not well-formed JSON or XML, it is too large or too deeply nested, or the XML has a DTD or entities). The drop was moved to _problem; fix the file and put the drop back.
INT_WATCH_CLAIM_LOST.cause=The claim was lost: another app instance took the drop first, or a stuck claim was released meanwhile.
INT_WATCH_MOVE_FAILED.cause=Moving a drop (to _processing, _archive, _problem or _quarantine) failed.
INT_WATCH_MOVE_FAILED.fix=A drop could not be moved inside the watched folder. Check the service account's right to rename and delete there, and that no other program holds the files open.
INT_WATCH_FILE_CHANGED.cause=A file of the drop changed after it was claimed: its checksum or size differs, or the bytes the virus scanner read are not the ones checked.
INT_WATCH_FILE_CHANGED.fix=A file of the drop changed after the app took it. The customer's process must finish writing every file before it writes the trigger file. The drop was moved to _problem.
INT_WATCH_DROP_INVALID.cause=The drop cannot be taken as it is: a link (symbolic link or junction) or a folder inside it, more files than the limit, a file larger than the limit, or a trigger name that two files match.
INT_WATCH_DROP_INVALID.fix=The drop cannot be taken: it holds a link or a folder, more files than allowed, a file larger than allowed, or more than one trigger file. The drop was moved to _problem.
INT_WATCH_INCOMPLETE.cause=Files present without their trigger after the incomplete-drop time (reported once; nothing is moved).
INT_WATCH_REFUSED.cause=The app refused the drop; its own code is in problem.json.
INT_WATCH_HANDLER_FAILED.cause=The app's intake handler failed (an error, not an answer): the drop was put back, to be tried again.
INT_SCAN_INFECTED.cause=The scanner found a virus: the file is quarantined and never handed over.
INT_SCAN_FAILED.cause=The scanner answered with an error or something that is not a scan result. The file is held, never let through.
INT_SCAN_FAILED.fix=The virus scanner could not scan an incoming file (it answered with an error). The file is held and scanned again at the next pass. Check the scanner's log.
INT_SCAN_UNREACHABLE.cause=The scanner cannot be reached or did not answer in time. The file is held, never let through.
INT_SCAN_UNREACHABLE.fix=The virus scanner cannot be reached or did not answer in time. Incoming files are held until it answers. Check the scanner's address, port and firewall.
INT_SIGN_IN_NONE_NOT_ALLOWED.cause=Sign-in NONE is used where it is not allowed (hosted, or not switched on for this installation).
INT_TOKEN_UNREACHABLE.cause=The token address could not be reached, or answered 429 / 5xx.
INT_TOKEN_REFUSED.cause=The token address refused the request (for example an unknown scope or audience).
INT_TOKEN_CREDENTIAL_REFUSED.cause=The token address refused the client's credential (invalid_client, unauthorized_client).
INT_TOKEN_CLIENT_UNKNOWN.cause=The token address does not know the client or the directory.
INT_TOKEN_CREDENTIAL_INVALID.cause=The certificate credential in the secret store is not a certificate with its matching private key.
INT_TOKEN_CREDENTIAL_EXPIRED.cause=The certificate credential has expired.
INT_TOKEN_UNEXPECTED_REPLY.cause=The token address answered 200 with something that is not a bearer token.
INT_TOKEN_CLAIMS_MISSING.cause=The token lacks a claim the configuration requires, or is not a JWT whose claims can be read.
INT_DISABLED.cause=The integration is switched off.
INT_KIND_NOT_SUPPORTED.cause=This kind of integration is not run by the call engine (yet).
INT_VALUE_MISSING.cause=A value a template needs was not supplied.
INT_VALUE_NOT_ALLOWED.cause=A value cannot be placed where the template puts it (control characters in a header, a non-number).
INT_FILE_TOO_LARGE.cause=A document is larger than the integration's limit.
INT_TOO_MANY_DOCUMENTS.cause=More documents than the integration's limit.
INT_PACKAGE_TOO_LARGE.cause=The documents together are larger than the integration's limit.
INT_SENSITIVE_FIELD_NOT_ALLOWED.cause=A sensitive case field would be sent although the configuration does not allow that key.
INT_FIELD_VALUES_INVALID.cause=The delivery's case field values are not a readable platform-field-values/1 document.
INT_CONTENT_UNREADABLE.cause=A document's content could not be read from the app.
INT_CONFIG_UNREADABLE.cause=A stored integration configuration is not readable ({where}).
INT_ADDRESS_NOT_SECURE.cause=The address is not https and plain http is not allowed for this installation.
INT_ACCEPTED.cause=The destination accepted the request for later processing (202): check its status later.
INT_STATUS_FAILED.cause=The destination's status says the work failed. Its own code, if any, is in the result.
INT_STATUS_REFERENCE_MISSING.cause=A 202 answer without the status reference the configuration says where to find.
INT_STATUS_UNKNOWN.cause=A status answer whose state is none of the configured done, failed or still-working values.
INT_CALLBACK_SIGNATURE.cause=Callback in: the signature header is missing, malformed, or matches none of the secrets.
INT_CALLBACK_EXPIRED.cause=Callback in: its time is outside the allowed window (old, or too far ahead).
INT_CALLBACK_REPLAYED.cause=Callback in: this callback ID was already accepted.
INT_CALLBACK_BODY_INVALID.cause=Callback out: the body is not one JSON object, or it is larger than the limit.
INT_CALLBACK_NOT_FOUND.cause=Callback out: no callback with this ID (to resend).
INT_TEST_CHECKED.cause=Test action in check-only mode: health and sign-in worked; no step was sent.
INT_CONFIG_PLACEHOLDER_FORBIDDEN.cause=A placeholder for a secret, sign-in or document content.
INT_CONFIG_PLACEHOLDER_IN_QUERY.cause=A placeholder in the query string or the host of an address.
INT_CONFIG_PLACEHOLDER_PLACE.cause=A placeholder where its value cannot go (for example text outside a JSON string).
INT_CONFIG_STEP_VALUE_UNKNOWN.cause=A step placeholder naming a step that does not run earlier, or a value that step does not read.
INT_CONFIG_HEADER_RESERVED.cause=A header that only the sign-in bundle or the HTTP layer may set (Authorization, Host, ...).
INT_CONFIG_SIGN_IN_NONE_WARNING.cause=Warning (not an error): sign-in NONE is in use on this on-premises installation.
INT_CONFIG_FIELD_UNKNOWN.cause=A {field:} placeholder names a field the entity does not have (or no field list was given).
INT_CONFIG_SENSITIVE_FIELD_NOT_ALLOWED.cause=A sensitive field is mapped without being allowed for this integration, or outside a JSON body.
INT_CONFIG_SETTING_INVALID.cause=A setting (profile setting, required token claims) is not valid.
INT_CONFIG_BODY_INVALID.cause=A multipart or integrity part of a step is not valid.
INT_CONFIG_OMIT_PLACE.cause=An "omit when missing" placeholder ({name?}) stands anywhere but as the whole value of an object member in a JSON body.
INT_CONFIG_FOLDER_INVALID.cause=Folder export: the target folder is not an absolute local or share path, or a folder or file name template is not one path segment of allowed characters and placeholders.
INT_CONFIG_FOLDER_HOSTED.cause=Folder export on the hosted service: never allowed (a folder is the customer's own system).
INT_CONFIG_MUTUAL_TLS_INVALID.cause=Mutual TLS: the address is not https, or the sign-in alongside the certificate is not allowed (NONE, or mutual TLS twice), or the certificate is to be used for a token request without OAuth 2.0.
INT_CONFIG_CALLBACK_INVALID.cause=Callback: no signing secret, a callback setting on another kind, or steps on a callback.
INT_CONFIG_SECRET_SCOPE.kind=REFUSED
INT_CONFIG_SECRET_SCOPE.cause=A secret reference of the integration is not under its own entity (int/<entity UUID or slot ID>/<name>): one entity's integration may never name another entity's secret. Refused at save, and at use before the secret store is asked.
INT_CONFIG_SECRET_SCOPE.fix=Keep the integration's secrets under its own entity in the secret store (for example int/ENT-0001/api-client-secret) and name that reference in the field the message gives (docs/install/integration.md, "Secret references").
INT_CONFIG_ACCEPTED_INVALID.cause="Accepted, check later": not on the last step run once, a pointer that is not valid, no status path (or one with a Location reference), no done or failed values, or the same value in two lists.
INT_CONFIG_POLL_INVALID.cause=API polling: no poll source, or one whose steps, pointers, paging or values are not valid (a body on a GET, a placeholder where it cannot go, a page size or page count out of range).
INT_CONFIG_WATCH_INVALID.cause=Watched folder: no source, a root that is not an absolute local or share path, a trigger pattern that is not valid, a mapping that is not a JSON pointer or XML path, or times and limits out of range; or the hosted service.
INT_PROFILE_UNREADABLE.cause=The profile file cannot be read.
INT_PROFILE_NOT_JSON.cause=The profile is not JSON (or not one object).
INT_PROFILE_FORMAT_UNKNOWN.cause=The profile's format is not one this version knows (only platform-integration-profile/1).
INT_PROFILE_SCHEMA.cause=The profile does not fit the format's JSON Schema (a field missing, unknown, of another type or shape).
INT_PROFILE_STEPS.cause=Steps: neither steps nor a packaging preset (or both), a preset missing its parts, or steps that cannot run.
INT_PROFILE_TEMPLATE.cause=A template: an unknown or forbidden placeholder, one in the query string, a body that is not JSON.
INT_PROFILE_HEADER.cause=A header only the sign-in bundle or HTTP may set, or a header name that is not valid.
INT_PROFILE_RULE.cause=A classification rule that is not valid.
INT_PROFILE_VALUE_UNDECLARED.cause=A template uses {value.} that the profile's values do not declare.
INT_PROFILE_ATTRIBUTE.cause=A template uses {doc.attr.} not declared, or an attribute's default is not among its values.
INT_PROFILE_FIELDS.cause=The fields target names no step, or that step's body has no "":{} to fill.
INT_PROFILE_SETTING.cause=A setting's default is not one of its values, or a value stands for an engine setting that does not exist.
INT_PROFILE_SIGN_IN.cause=Sign-in: an API key without its header name.
INT_PROFILE_INSTALLATION_DATA.cause=Installation data in a profile: an address, something that looks like a secret, or a case field key.
INT_HEALTHY.cause=The health check got the answer the integration expects.
