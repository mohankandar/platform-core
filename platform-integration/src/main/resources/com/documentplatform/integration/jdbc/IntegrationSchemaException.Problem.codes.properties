# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=FAILED
*.message=The application cannot start: its database is not ready. IT has been told.
*.support=The app's database was not prepared for this release. Ask the customer's IT to run the schema step named in the app's log (the install guide says how), then start the app.
INT_TABLES_MISSING.fix=Run the integration schema step (Flyway location db/platform/integration) as the schema owner, then start the app.
INT_TABLES_INCOMPLETE.fix=Restore the missing tables by running the integration schema step again on a database where they exist, or restore the database; never create them by hand.
INT_VERSION_UNKNOWN.fix=Check the integration version table was not emptied or dropped; run the integration schema step.
INT_VERSION_UNKNOWN.cause=Some tables exist but the version table is missing or empty.
INT_VERSION_OLDER.fix=Run the integration schema step of this release (Flyway location db/platform/integration), then start the app.
INT_VERSION_NEWER.fix=Install the app release that matches the database, or restore the database from before the upgrade.
INT_PRIVILEGES_MISSING.fix=Grant the app's database user the rights the install guide lists on the integration tables (SELECT, INSERT, UPDATE, DELETE; SELECT on the version table).
INT_CHECK_FAILED.fix=Check the database is reachable and the app's user may read the system catalogue; the SQL state in the log says why the check was refused.
INT_TABLES_MISSING.cause=None of the integration tables exist: the schema step was never run on this database schema.
INT_TABLES_INCOMPLETE.cause=The version is right but some integration tables are missing.
INT_VERSION_OLDER.cause=The integration tables are older than the code: the schema step for this release was not run.
INT_VERSION_NEWER.cause=The integration tables are newer than the code: an older app release runs against an upgraded database.
INT_PRIVILEGES_MISSING.cause=The app's database user may not read or write a integration table.
INT_CHECK_FAILED.cause=The database refused the integration check itself.

