# Texts of these platform codes (PlatformCode, platform-errors). Never a secret, token, document content or value.
MG_STORE_FAILED.kind=FAILED
MG_STORE_FAILED.message=The information could not be read or saved right now. Please try again later.
MG_STORE_FAILED.cause=A read or write of the model-governance tables failed: {operation} (SQL state {sqlState}).
MG_STORE_FAILED.fix=Check the database is reachable and the app's database user has its rights on the model-governance tables (docs/install/model-governance.md); the SQL state says why.
MG_STORE_FAILED.support=The app could not use its database; ask the customer's IT for the code, reference and SQL state.
