# Texts of the model-governance schema codes (PlatformCode, platform-errors).
*.kind=FAILED
*.message=The application cannot start: its database is not ready. IT has been told.
*.support=The app's database was not prepared for this release. Ask the customer's IT to run the schema step named in the app's log (the install guide says how), then start the app.
MG_TABLES_MISSING.fix=Run the model-governance schema step (Flyway location db/platform/modelgov) as the schema owner, then start the app.
MG_TABLES_INCOMPLETE.fix=Restore the missing tables by running the model-governance schema step again on a database where they exist, or restore the database; never create them by hand.
MG_VERSION_UNKNOWN.fix=Check the model-governance version table was not emptied or dropped; run the model-governance schema step.
MG_VERSION_UNKNOWN.cause=Some tables exist but the version table is missing or empty.
MG_VERSION_OLDER.fix=Run the model-governance schema step of this release (Flyway location db/platform/modelgov), then start the app.
MG_VERSION_NEWER.fix=Install the app release that matches the database, or restore the database from before the upgrade.
MG_PRIVILEGES_MISSING.fix=Grant the app's database user the rights the install guide lists on the model-governance tables (SELECT, INSERT, UPDATE, DELETE; SELECT on the version table).
MG_CHECK_FAILED.fix=Check the database is reachable and the app's user may read the system catalogue; the SQL state in the log says why the check was refused.
MG_TABLES_MISSING.cause=None of the model-governance tables exist: the schema step was never run on this database schema.
MG_TABLES_INCOMPLETE.cause=The version is right but some model-governance tables are missing.
MG_VERSION_OLDER.cause=The model-governance tables are older than the code: the schema step for this release was not run.
MG_VERSION_NEWER.cause=The model-governance tables are newer than the code: an older app release runs against an upgraded database.
MG_PRIVILEGES_MISSING.cause=The app's database user may not read or write a model-governance table.
MG_CHECK_FAILED.cause=The database refused the model-governance check itself.
