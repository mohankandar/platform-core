# Texts of the model-governance codes (PlatformCode, platform-errors). Never document content or values.
*.kind=REFUSED
*.support=Ask the customer's IT or Model approver for the code and reference; docs/design/model-governance.md describes the change gate. The model screens in the app show the use's validations, approvals and live version.

MOD_UNKNOWN.message=This model, use or validation is not known.
MOD_UNKNOWN.cause=No {what} with the ID {id} is registered.
MOD_UNKNOWN.fix=Check the ID on the app's model screens; register the model or use first.
MOD_VALUE_INVALID.message=A value cannot be saved as it is. The screen says which.
MOD_VALUE_INVALID.cause=The value of {field} is not allowed: {rule}.
MOD_VALUE_INVALID.fix=Correct the value as the rule says; free text must never hold document content or a secret.
MOD_VERSION_CONFLICT.message=Someone else changed this meanwhile. Reload it and try again.
MOD_VERSION_CONFLICT.cause=The {what} was changed by someone else since it was opened.
MOD_VERSION_CONFLICT.fix=Reload and make the change again.
MOD_THRESHOLD_LOOSER.message=This pass mark is looser than the agreed default and cannot be set.
MOD_THRESHOLD_LOOSER.cause=The customer's threshold {value} for {measure} is looser than the default {default}.
MOD_THRESHOLD_LOOSER.fix=Set a threshold at least as strict as the default; a customer may only tighten pass marks.
MOD_THRESHOLD_MISSING.message=This validation cannot be recorded: a pass mark is missing.
MOD_THRESHOLD_MISSING.cause=The measure {measure} has a result but no threshold for this use.
MOD_THRESHOLD_MISSING.fix=Set the use's default threshold for the measure (the app's pass marks), then record the validation again.
MOD_APPROVER_ROLE.message=You cannot approve models. A Model approver must do it.
MOD_APPROVER_ROLE.cause=The person {approver} holds none of the Model approver roles.
MOD_APPROVER_ROLE.fix=Have a person with the Model approver role (or the compliance officer, where configured) approve it.
MOD_APPROVER_CONFLICT.message=You cannot approve models while you also hold an administration role that must stay separate.
MOD_APPROVER_CONFLICT.cause=The person {approver} holds the role {role}, which may never also approve models.
MOD_APPROVER_CONFLICT.fix=Have a Model approver who does not hold that role approve it; keep the two roles with different people.
MOD_VALIDATION_FAILED.message=This validation did not meet its pass marks and cannot be approved.
MOD_VALIDATION_FAILED.cause=The validation {validation} failed: {failed}.
MOD_VALIDATION_FAILED.fix=Correct the model or its configuration and record a new validation that passes.
MOD_ALREADY_APPROVED.kind=INFO
MOD_ALREADY_APPROVED.message=This validation is already approved.
MOD_ALREADY_APPROVED.cause=The validation {validation} was already approved.
MOD_ALREADY_APPROVED.fix=Nothing to do.
MOD_CUSTOMER_MODEL_BLOCKED.message=Your own model did not pass the test set and cannot be used for this purpose.
MOD_CUSTOMER_MODEL_BLOCKED.cause=The customer-supplied model failed the test set of a high-materiality use; it is blocked.
MOD_CUSTOMER_MODEL_BLOCKED.fix=Use a model that passes the test set (for example the app's default model) for this use.
MOD_ACCEPTANCE_NOT_APPLICABLE.message=A documented acceptance cannot be recorded for this validation.
MOD_ACCEPTANCE_NOT_APPLICABLE.cause=Acceptance is only for a customer-supplied model that failed the test set of a medium-materiality use ({reason}).
MOD_ACCEPTANCE_NOT_APPLICABLE.fix=Record a validation that passes instead.
MOD_REASON_REQUIRED.message=Give the reason for accepting these results.
MOD_REASON_REQUIRED.cause=A documented acceptance needs a reason (1 to 1000 characters, no document content).
MOD_REASON_REQUIRED.fix=Write why the results are accepted, in plain words.

MOD_NOT_VALIDATED.kind=FAILED
MOD_NOT_VALIDATED.message=This AI feature is switched off until its model is validated. IT has been told.
MOD_NOT_VALIDATED.cause=The use {use} has no recorded validation for entity {entity}.
MOD_NOT_VALIDATED.fix=Run the use's test set and record the validation; then have a Model approver approve it and switch it live.
MOD_NOT_APPROVED.kind=FAILED
MOD_NOT_APPROVED.message=This AI feature is switched off until its model is approved. IT has been told.
MOD_NOT_APPROVED.cause=The use {use} has a validation for entity {entity}, but none is approved.
MOD_NOT_APPROVED.fix=Have a Model approver approve the validation, then switch it live.
MOD_NOT_LIVE.kind=FAILED
MOD_NOT_LIVE.message=This AI feature is switched off until its approved model is switched live. IT has been told.
MOD_NOT_LIVE.cause=The use {use} has an approved validation but no live model for entity {entity}.
MOD_NOT_LIVE.fix=Switch the approved validation live on the model screens.
MOD_DIGEST_MISMATCH.kind=FAILED
MOD_DIGEST_MISMATCH.message=This AI feature is stopped: its model changed since it was approved. IT has been told.
MOD_DIGEST_MISMATCH.cause=The model running for {use} has digest {observed}; the validated model has {expected}. The model file or pull changed.
MOD_DIGEST_MISMATCH.fix=Put back the validated model (the digest named), or validate and approve the new one before it runs.
MOD_CONFIG_CHANGED.kind=FAILED
MOD_CONFIG_CHANGED.message=This AI feature is stopped: its settings changed since they were approved. IT has been told.
MOD_CONFIG_CHANGED.cause=The prompt or settings of {use} changed (fingerprint {observed}; validated {expected}) without a validation.
MOD_CONFIG_CHANGED.fix=Put back the validated configuration, or validate and approve the new one before it runs.
MOD_RETIRED.kind=FAILED
MOD_RETIRED.message=This AI feature is retired.
MOD_RETIRED.cause=The use {use} is retired.
MOD_RETIRED.fix=Register and validate a new use if the feature is still needed.
MOD_REVIEW_OVERDUE.kind=FAILED
MOD_REVIEW_OVERDUE.message=This AI feature's periodic review is overdue. IT has been told.
MOD_REVIEW_OVERDUE.cause=The use {use} was due for review on {due}.
MOD_REVIEW_OVERDUE.fix=Re-run the test set, record the validation and have it approved; the next review date then moves on.
MOD_NO_ROLLBACK_TARGET.message=There is no earlier version to go back to.
MOD_NO_ROLLBACK_TARGET.cause=The use {use} has no previous live validation for entity {entity}.
MOD_NO_ROLLBACK_TARGET.fix=Approve and switch live a validated version instead.
MOD_WRONG_USE.message=This validation belongs to another use or entity.
MOD_WRONG_USE.cause=The validation {validation} is for another use or entity than {use} / {entity}.
MOD_WRONG_USE.fix=Pick a validation of this use and entity.
