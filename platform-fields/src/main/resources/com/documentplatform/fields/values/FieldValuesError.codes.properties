# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.message=The case field values could not be saved or found. The screen says why.
*.fix=Follow the message; see docs/install/fields.md.
*.support=Ask the customer's IT for the code and reference; the fields install guide says what each code means.
VALUES_STORE_FAILED.kind=FAILED
VALUES_STORE_FAILED.message=Case field values cannot be saved right now. Please try again in a few minutes.
VALUES_STORE_FAILED.fix=Check the database and the key service are reachable (health); the log line with the reference has the cause.
VALUES_CHANGED_MEANWHILE.message=Someone else changed these values meanwhile. Reload and try again.
VALUES_LEGAL_HOLD.kind=INFO
VALUES_LEGAL_HOLD.fix=Nothing to do: the record is on legal hold and is erased once the hold is lifted.
VALUES_ERASE_OUTSIDE_LOG.fix=App fault: erase case field values only through the erase log (Eraser with CaseFieldsEraseHandler).
VALUES_LEGAL_HOLD_UNKNOWN.kind=FAILED
VALUES_LEGAL_HOLD_UNKNOWN.fix=Check the app's legal-hold lookup is reachable; nothing is erased until it answers.

# ---- per code
VALUES_RECORD_REF_INVALID.cause=The record type or record ID is not valid.
VALUES_INVALID.cause=One or more values broke their field's rules; the message lists each field and the rule it breaks.
VALUES_RECORD_UNKNOWN.cause=No record with that type and ID in the entity and product.
VALUES_WRONG_CUSTOMER.cause=The record belongs to another customer than the one this app instance serves.
VALUES_PRIMARY_TAKEN.cause=The record's new primary value(s) are already another record's (one record per primary value set).
VALUES_CONFLICT.cause=A claim found the record by its primary value(s) (or its ID), but it already holds a different value for a field given; nothing was written. Only the field keys are named.
VALUES_CHANGED_MEANWHILE.cause=The record kept changing while it was written (other writers); try again.
VALUES_FIELD_UNKNOWN.cause=Search or lookup named a key the entity has no field for.
VALUES_NOT_SEARCHABLE.cause=Search on a field that is not searchable.
VALUES_SENSITIVE_EXACT_ONLY.cause=Prefix or partial search on a sensitive field: sensitive fields are searchable by exact match only.
VALUES_SEARCH_MODE_NOT_ALLOWED.cause=A search mode the field does not offer (for example partial search on an exact-match field).
VALUES_NOT_PRIMARY.cause=A lookup by primary value named a field that is not primary, or gave no primary value.
VALUES_LEGAL_HOLD.cause=The app's legal hold check says the record is held, so its values may not be erased.
VALUES_LEGAL_HOLD_UNKNOWN.cause=The app's legal hold check could not answer, so the erase was refused (nothing was erased).
VALUES_ERASE_OUTSIDE_LOG.cause=FieldValues#erase was called from outside the erase log: a record is erased only through the erase log's case-fields handler, so that every erasure is logged (nothing was erased).
VALUES_STORE_FAILED.cause=The database refused or failed the call (the message has the SQL state only).
FLD_PARTIAL_SEARCH_UNAVAILABLE.kind=INFO
FLD_PARTIAL_SEARCH_UNAVAILABLE.message=Search for part of a value works as a search for its beginning.
FLD_PARTIAL_SEARCH_UNAVAILABLE.cause=The trigram index for partial search is missing (the pg_trgm extension, or db/platform/fields-optional/partial-search.sql was not run).
FLD_PARTIAL_SEARCH_UNAVAILABLE.fix=The DBA makes the pg_trgm extension available and runs db/platform/fields-optional/partial-search.sql as the owner of the fld_ tables (docs/install/fields.md).
FLD_PARTIAL_SEARCH_UNAVAILABLE.support=Partial search falls back to prefix search until the optional index is installed; nothing is wrong with the data.
