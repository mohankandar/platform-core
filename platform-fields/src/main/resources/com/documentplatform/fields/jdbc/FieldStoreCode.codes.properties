# Texts of these platform codes (PlatformCode, platform-errors). Never a secret, token, document content or value.
FLD_STORE_FAILED.kind=FAILED
FLD_STORE_FAILED.message=The information could not be read or saved right now. Please try again later.
FLD_STORE_FAILED.cause=A read or write of the case field tables failed: {operation} (SQL state {sqlState}).
FLD_STORE_FAILED.fix=Check the database is reachable and the app's database user has its rights on the case field tables (docs/install/fields.md); the SQL state says why.
FLD_STORE_FAILED.support=The app could not use its database; ask the customer's IT for the code, reference and SQL state.
