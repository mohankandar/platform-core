# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=FAILED
*.message=The application cannot start: its database is not ready. IT has been told.
*.support=The app's database was not prepared for this release. Ask the customer's IT to run the schema step named in the app's log (the install guide says how), then start the app.
FLD_TABLES_MISSING.fix=Run the case-fields schema step (Flyway location db/platform/fields) as the schema owner, then start the app.
FLD_TABLES_INCOMPLETE.fix=Restore the missing tables by running the case-fields schema step again on a database where they exist, or restore the database; never create them by hand.
FLD_VERSION_UNKNOWN.fix=Check the case-fields version table was not emptied or dropped; run the case-fields schema step.
FLD_VERSION_UNKNOWN.cause=Some tables exist but the version table is missing or empty.
FLD_VERSION_OLDER.fix=Run the case-fields schema step of this release (Flyway location db/platform/fields), then start the app.
FLD_VERSION_NEWER.fix=Install the app release that matches the database, or restore the database from before the upgrade.
FLD_PRIVILEGES_MISSING.fix=Grant the app's database user the rights the install guide lists on the case-fields tables (SELECT, INSERT, UPDATE, DELETE; SELECT on the version table).
FLD_CHECK_FAILED.fix=Check the database is reachable and the app's user may read the system catalogue; the SQL state in the log says why the check was refused.
FLD_TABLES_MISSING.cause=None of the case-fields tables exist: the schema step was never run on this database schema.
FLD_TABLES_INCOMPLETE.cause=The version is right but some case-fields tables are missing.
FLD_VERSION_OLDER.cause=The case-fields tables are older than the code: the schema step for this release was not run.
FLD_VERSION_NEWER.cause=The case-fields tables are newer than the code: an older app release runs against an upgraded database.
FLD_PRIVILEGES_MISSING.cause=The app's database user may not read or write a case-fields table.
FLD_CHECK_FAILED.cause=The database could not be reached, or refused the case-fields check itself.

