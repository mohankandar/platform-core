# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.message=The field values sent with this item are not valid. IT has the details.
*.fix=Correct the sending system's field values document (format platform-field-values/1) at the place named.
*.support=The sending system's case field values do not match the field list; ask the customer's IT to correct the sending system's mapping.

# ---- per code
DELIVERY_UNREADABLE.cause=Not JSON of the strict subset used.
DELIVERY_TOO_LARGE.cause=Larger than 2 MB or more than 1000 entries.
DELIVERY_FORMAT_UNKNOWN.cause=Not a platform-field-values/1 document.
DELIVERY_SHAPE_INVALID.cause=An entry or member is missing, unknown or of the wrong kind.
DELIVERY_KEY_INVALID.cause=An entry's key is not a valid field key.
DELIVERY_KEY_REPEATED.cause=Two entries with the same key.
DELIVERY_KEY_UNKNOWN.cause=No field with this key here.
DELIVERY_FIELD_INACTIVE.cause=The field here is switched off.
DELIVERY_TYPE_MISMATCH.cause=The entry's type is not the type of the field here.
DELIVERY_CURRENCY_MISMATCH.cause=MONEY in another currency than the field here.
DELIVERY_VALUE_COUNT_MISMATCH.cause=A list of values for a field that takes one, or one value for a multi-value field.
DELIVERY_VALUE_INVALID.cause=A value breaks the field's rules; see #valueError().
DELIVERY_REQUIRED_MISSING.cause=A required field here has no entry.
