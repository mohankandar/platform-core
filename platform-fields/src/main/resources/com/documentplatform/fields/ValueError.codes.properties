# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.http=422
*.message=A case field value is not valid. Correct the value shown on the screen.
*.fix=Nothing for IT: the person corrects the value. If a sending system sent it, correct its mapping for this field.
*.support=A value did not match the field's rules; the screen names the field. If it came from another system, the customer's IT corrects that system's mapping.
FIELD_UNKNOWN.fix=Use a field defined for the entity and product; check the field's key.
FIELD_INACTIVE.fix=Switch the field on again, or stop sending it.

# ---- per code
VALUE_REQUIRED.cause=The field is required and no value was given.
VALUE_EMPTY.cause=The value is blank.
VALUE_TOO_LONG.cause=Longer than 512 characters (an address: all parts together).
VALUE_CONTROL_CHARACTERS.cause=Has control characters such as line breaks.
VALUE_NOT_A_NUMBER.cause=NUMBER: not a whole number.
VALUE_NOT_A_DECIMAL.cause=DECIMAL: not a number.
VALUE_NOT_MONEY.cause=MONEY: not an amount.
VALUE_TOO_MANY_DECIMALS.cause=MONEY: more decimals than the currency has.
VALUE_BELOW_MINIMUM.cause=NUMBER, DECIMAL, MONEY: below the lowest value.
VALUE_ABOVE_MAXIMUM.cause=NUMBER, DECIMAL, MONEY: above the highest value.
VALUE_NOT_A_DATE.cause=DATE: not a calendar date.
VALUE_NOT_A_DATE_TIME.cause=DATE_TIME: not a date and time with its offset from UTC.
VALUE_NOT_AN_EMAIL.cause=EMAIL: not an e-mail address.
VALUE_NOT_A_UUID.cause=UUID: not a UUID.
VALUE_NOT_AN_OPTION.cause=DROPDOWN: not one of the listed values.
VALUE_PATTERN_MISMATCH.cause=Does not match the field's pattern.
VALUE_LENGTH_NOT_EXACT.cause=Not exactly the required number of characters.
VALUE_TOO_SHORT.cause=Shorter than the minimum length.
VALUE_ABOVE_MAX_LENGTH.cause=Longer than the field's maximum length.
ADDRESS_STREET_MISSING.cause=ADDRESS: the street is missing.
ADDRESS_CITY_MISSING.cause=ADDRESS: the city is missing.
ADDRESS_STATE_INVALID.cause=ADDRESS: the state is not a two-letter US state or territory code.
ADDRESS_ZIP_INVALID.cause=ADDRESS: the ZIP is not 5 digits or ZIP+4.
ADDRESS_COUNTRY_NOT_SUPPORTED.cause=ADDRESS: only US addresses for now.
VALUE_WRONG_SHAPE.cause=An address was given for a field that is not ADDRESS, or text for an ADDRESS field.
VALUE_NOT_MULTI.cause=Several values for a field that takes one.
VALUE_TOO_MANY.cause=More than 50 values.
VALUE_REPEATED.cause=The same value twice (once normalised).
FIELD_UNKNOWN.cause=A value for a key the entity has no field for.
FIELD_INACTIVE.cause=A value for a field that is switched off.
