# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.message=The field list file cannot be imported. Nothing was changed.
*.fix=Correct the field list file (format platform-fields/1) at the place named and import it again.
*.support=Ask the customer's admin to correct the field list file as the message says and import it again.

# ---- per code
FILE_UNREADABLE.cause=Not JSON of the strict subset used (no null, whole numbers only, no repeated members).
FILE_FORMAT_UNKNOWN.cause=Not a platform-fields/1 file.
FILE_SHAPE_INVALID.cause=A member is missing, unknown or of the wrong kind.
FILE_FIELD_INVALID.cause=A field breaks a rule of the model; the problem names the field and the rule (its field definition code).
FILE_KEY_REPEATED.cause=Two fields with the same key (ignoring capitals).
FILE_TOO_LARGE.cause=More than 1000 fields, or larger than 5 MB.
