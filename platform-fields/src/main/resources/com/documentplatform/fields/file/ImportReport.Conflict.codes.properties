# Texts of these platform codes (PlatformCode, platform-errors). Never a secret, token, document content or value.
*.kind=REFUSED
*.message=A field of the field list conflicts with a field here; it was left as it is.
*.fix=Compare the field in the list with the one here: rename the field in the list (a new key), or change it to match; the field here is never changed by an import (docs/install/fields.md).
*.support=The field list import left a field as it is because it conflicts; the import report names the field.
TYPE_DIFFERS.cause=The existing field with this key has another type.
CURRENCY_DIFFERS.cause=Both fields are MONEY, in different currencies.
KEY_CASE_DIFFERS.cause=The existing field's key differs only in capitals.
