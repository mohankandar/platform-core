# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.message=The case field cannot be saved as it is. The screen says what to correct.
*.fix=Correct the field definition as the message says (docs/install/fields.md).
*.support=Ask the customer's admin to read the message on the case fields screen; it names what to correct.
FIELD_CHANGED_MEANWHILE.message=Someone else changed this field meanwhile. Reload it and try again.
FIELD_CHANGED_MEANWHILE.fix=Reload the field and make the change again.
FIELD_KEY_LOCKED.fix=Values exist for this field: its key, type, sensitive and primary flags stay as they are. Add a new field instead.
FIELD_TYPE_LOCKED.fix=Values exist for this field: its key, type, sensitive and primary flags stay as they are. Add a new field instead.
FIELD_SENSITIVE_LOCKED.fix=Values exist for this field: its key, type, sensitive and primary flags stay as they are. Add a new field instead.
FIELD_PRIMARY_LOCKED.fix=Values exist for this field: its key, type, sensitive and primary flags stay as they are. Add a new field instead.

# ---- per code
FIELD_KEY_INVALID.cause=The key does not start with a letter or has other characters than letters, digits, '_', '.', '-'.
FIELD_LABEL_INVALID.cause=The label is blank, longer than 200 characters or has control characters.
FIELD_PRODUCT_INVALID.cause=The product code is not 2–32 capital letters, digits or '_', starting with a letter.
FIELD_CURRENCY_REQUIRED.cause=A MONEY field needs its currency.
FIELD_CURRENCY_INVALID.cause=The currency is not an ISO 4217 code with a fixed number of decimals (USD, EUR, ...).
FIELD_RULE_NOT_FOR_TYPE.cause=A rule was given for a type it does not apply to (for example a currency on a TEXT field).
FIELD_LENGTH_INVALID.cause=Length rules: below 1, above 512, an exact length together with a minimum or maximum, or min above max.
FIELD_PATTERN_REQUIRED.cause=A CUSTOM_PATTERN field needs its pattern.
FIELD_PATTERN_INVALID.cause=The pattern is not a valid regular expression or is longer than 512 characters.
FIELD_OPTIONS_REQUIRED.cause=A DROPDOWN field needs at least one value to choose from.
FIELD_OPTIONS_TOO_MANY.cause=A DROPDOWN field has more than 100 values.
FIELD_OPTION_INVALID.cause=A dropdown value is blank, longer than 512 characters or has control characters.
FIELD_OPTION_REPEATED.cause=Two dropdown values are the same once normalised.
FIELD_RANGE_INVALID.cause=The lowest or highest value: not a number of the type, or the lowest above the highest.
FIELD_SENSITIVE_EXACT_ONLY.cause=A sensitive field is searchable by exact match only.
FIELD_SEARCH_MODE_INVALID.cause=A field that is not searchable keeps the search mode EXACT.
FIELD_PRIMARY_MULTI_VALUE.cause=A primary identifier takes one value, not several.
FIELD_PRIMARY_INACTIVE.cause=A switched-off field cannot be a primary identifier.
FIELD_DISPLAY_ORDER_INVALID.cause=The display order is below 0 or above 10000.
FIELD_ACTOR_INVALID.cause=The person or process making the change is not named (1–200 characters, no control characters).
FIELD_EXTENSION_INVALID.cause=An app setting's name or value is not valid.
FIELD_KEY_TAKEN.cause=Another field of this entity and product already has this key (keys are compared ignoring capitals).
FIELD_UNKNOWN.cause=No field with this key in this entity and product.
FIELD_KEY_LOCKED.cause=A field's key never changes.
FIELD_TYPE_LOCKED.cause=Values exist for the field, so its type (and, for MONEY, its currency) cannot change: add a new field.
FIELD_SENSITIVE_LOCKED.cause=Values exist for the field, so it cannot become sensitive or stop being sensitive: add a new field.
FIELD_PRIMARY_LOCKED.cause=Values exist for the field, so it cannot become a primary identifier or stop being one: add a new field.
FIELD_CHANGED_MEANWHILE.cause=Someone else changed the field since it was read: read it again.
FIELD_VALUES_CHECK_FAILED.kind=FAILED
FIELD_VALUES_CHECK_FAILED.message=This field cannot be changed right now. Please try again later.
FIELD_VALUES_CHECK_FAILED.cause=The app's values check failed while a locked setting of field {key} (type, sensitive, primary) was being changed; nothing was changed.
FIELD_VALUES_CHECK_FAILED.fix=Check the app's database is reachable (the values check reads it), then make the change again.
FIELD_TRANSACTION_UNSUITABLE.kind=FAILED
FIELD_TRANSACTION_UNSUITABLE.message=This field cannot be saved right now. Please try again later.
FIELD_TRANSACTION_UNSUITABLE.cause=The app handed a connection to FieldDefinitions.in whose transaction the field definition store cannot join: auto-commit is on, or the isolation is not READ COMMITTED (nothing was saved).
FIELD_TRANSACTION_UNSUITABLE.fix=App fault: hand over the connection of an open transaction (auto-commit off) at READ COMMITTED, the database's default; with Spring, the connection of the current @Transactional (docs/install/fields.md, "In the app's transaction").
FIELD_TRANSACTION_UNSUITABLE.support=The app's code joins the field definitions to a transaction they cannot work in; report it to the app's developers with the code and reference.
FIELD_OPTION_NAME_INVALID.cause=A dropdown value's display name is longer than 200 characters or has control characters.
FIELD_OPTION_NAME_INVALID.fix=Shorten the display name or take out the line breaks and other control characters; a value without a name shows its code.
FIELD_OPTION_NAME_REPEATED.cause=Two dropdown values have the same display name, ignoring capitals and extra spaces.
FIELD_OPTION_NAME_REPEATED.fix=Give each dropdown value its own display name, or leave a name out so that value shows its code.
