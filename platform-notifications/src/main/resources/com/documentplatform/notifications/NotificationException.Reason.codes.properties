# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.message=The notification settings cannot be saved as they are. The screen says what to correct.
*.fix=Correct the setting named in the message and save again (docs/design/notifications.md lists the rules).
*.support=Ask the customer's IT Admin to read the message on the notification settings screen; it names the setting to correct.
UNKNOWN_EVENT_TYPE.fix=Use an event type of the app's catalogue; an app fault if the app sent it.
DUPLICATE_EVENT_TYPE.kind=FAILED
DUPLICATE_EVENT_TYPE.fix=App fault: the app's event catalogue lists an event type twice; correct the catalogue.

# ---- per code
INVALID_VALUE.cause=A value does not have the allowed shape (id, identifier, link, label, address).
UNKNOWN_EVENT_TYPE.cause=The event type is not in the catalogue.
DUPLICATE_EVENT_TYPE.cause=Two event types in one catalogue share an id.
CRITICAL_FREQUENCY.cause=A critical event set to anything other than Immediately or Every hour.
CRITICAL_MUST_BE_ON.cause=A critical event switched off.
CRITICAL_NEEDS_IT_ADMIN.cause=A critical event whose recipients leave out the IT Admin role.
NO_RECIPIENT_ROLES.cause=No recipient role.
TIMING_OUT_OF_RANGE.cause=A condition threshold or repeat interval outside the allowed range.
THRESHOLD_OUT_OF_RANGE.cause=A numeric threshold outside the range the event type declares.
UNKNOWN_THRESHOLD.cause=A threshold the event type does not declare.
UNKNOWN_FIELD.cause=A count or time the event type does not declare, or of the wrong kind.
WRONG_SETTINGS_LEVEL.cause=Technical settings given per entity, or business settings given at tenant level.
ENTITY_REQUIRED.cause=A business event without an entity.
NOT_A_CONDITION.cause=Condition calls for an event type that is not continuous, or condition timing on one.
IS_A_CONDITION.cause=A continuous event type published as a one-off event.
UNKNOWN_DESTINATION.cause=Settings name a destination the tenant has not connected.
