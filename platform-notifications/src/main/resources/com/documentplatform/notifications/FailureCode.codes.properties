# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=FAILED
*.message=A notification could not be delivered. It is tried again; IT has the details.
*.fix=Check the destination's settings in the notification settings and its health (docs/install/notifications.md); the outbox sends it again.
*.support=Ask the customer's IT for the code and reference; the notifications install guide says what to change for each delivery code.
MAIL_*.fix=Check the mail settings (platform.notifications.mail.*): server address and port, TLS, the sign-in and the sender address; then send a test.
MAIL_OAUTH_*.fix=Check the Microsoft 365 app registration (tenant, client ID, certificate or secret in the secret store) and that it may send as the sender address (docs/install/notifications.md).
MAIL_LOGIN_REFUSED.kind=REFUSED
MAIL_RECIPIENT_REFUSED.kind=REFUSED
MAIL_RECIPIENT_REFUSED.fix=Correct the recipient's e-mail address in the app, or ask the mail team why the server refuses it.
MAIL_MESSAGE_REJECTED.kind=REFUSED
MAIL_SMTP_AUTH_DISABLED.kind=REFUSED
MAIL_SMTP_AUTH_DISABLED.fix=Switch on SMTP AUTH for the sending mailbox in Microsoft 365, or use mail.auth OAUTH2_MICROSOFT.
MAIL_OAUTH_SEND_AS_NOT_ALLOWED.kind=REFUSED
WEBHOOK_*.fix=Check the webhook address of the Teams or Slack destination is current (create a new one in the channel if it was removed) and reachable from this server.
WEBHOOK_REJECTED.kind=REFUSED
WEBHOOK_PAYLOAD_REJECTED.kind=REFUSED
WEBHOOK_CONNECTOR_RETIRED.kind=REFUSED
WEBHOOK_CONNECTOR_RETIRED.fix=Replace the retired Office 365 connector with a Teams Workflows webhook and update the destination.
WEBHOOK_ADDRESS_INVALID.kind=REFUSED
WEBHOOK_ADDRESS_NOT_SECURE.kind=REFUSED
WEBHOOK_RATE_LIMITED.kind=INFO
WEBHOOK_RATE_LIMITED.fix=Nothing to do: the outbox waits and sends again; send fewer notifications to that channel if it lasts.
DESTINATION_NOT_CONFIGURED.kind=REFUSED
DESTINATION_NOT_CONFIGURED.fix=Configure the destination in the notification settings, or remove it from the event's routing.
DESTINATION_NOT_CONNECTED.kind=REFUSED
DESTINATION_NOT_CONNECTED.fix=Connect the destination (complete its settings) in the notification settings.
CHANNEL_NOT_AVAILABLE.kind=REFUSED
CHANNEL_NOT_AVAILABLE.fix=Switch on the channel in the install config, or route the event to another destination.
SECRET_NOT_FOUND.fix=Create the secret in the secret store under the name the destination's settings give, or correct the name.
SECRET_UNAVAILABLE.fix=Check the secret store is reachable and the app's account may read it.
NO_RECIPIENTS.kind=INFO
NO_RECIPIENTS.fix=Give the event's recipient roles to people, or route it to a channel.
RECIPIENTS_UNAVAILABLE.fix=Check the app's user directory is reachable; the outbox tries again.
SENDER_FAILED.fix=Look up the reference in the app's log; the outbox tries again.
ACTION_REQUEST_CLOSED.kind=INFO
ACTION_REQUEST_CLOSED.fix=Nothing to do: the request was already decided or expired.
ACTION_LINKS_NOT_AVAILABLE.kind=REFUSED
ACTION_LINKS_NOT_AVAILABLE.fix=Set platform.notifications.approvals.link-key-secret to enable approval links, or send without them.
ACTION_KEY_NOT_FOUND.fix=Create the approval link key in the secret store under the name in platform.notifications.approvals.link-key-secret.
ACTION_KEY_INVALID.fix=Store a link key of at least 32 random bytes under the name in platform.notifications.approvals.link-key-secret.

# ---- per code
MAIL_SERVER_UNREACHABLE.cause=Mail server could not be reached
MAIL_TIMEOUT.cause=Mail server did not answer in time
MAIL_TLS_FAILED.cause=Secure connection (TLS) to the mail server failed
MAIL_LOGIN_REFUSED.cause=Mail server refused the login
MAIL_RECIPIENT_REFUSED.cause=Mail server refused a recipient address
MAIL_TEMPORARILY_REFUSED.cause=Mail server refused the message for now
MAIL_MESSAGE_REJECTED.cause=Mail server rejected the message
MAIL_OAUTH_TOKEN_UNREACHABLE.cause=Microsoft sign-in (token endpoint) could not be reached or had a temporary fault
MAIL_OAUTH_CREDENTIAL_REFUSED.cause=Microsoft refused the app credential (wrong or expired client secret or certificate)
MAIL_OAUTH_APP_UNKNOWN.cause=Microsoft does not know the directory (tenant) ID or the application (client) ID
MAIL_OAUTH_CREDENTIAL_INVALID.cause=The app credential in the secret store is not a usable certificate with its private key
MAIL_OAUTH_TOKEN_REFUSED.cause=Microsoft refused to issue a token for sending mail
MAIL_OAUTH_UNEXPECTED_REPLY.cause=Microsoft sign-in replied in an unexpected way
MAIL_OAUTH_SEND_AS_NOT_ALLOWED.cause=The app is not allowed to send as the sender mailbox (Exchange permission missing)
MAIL_SMTP_AUTH_DISABLED.cause=SMTP AUTH is disabled for the sender mailbox
WEBHOOK_ADDRESS_INVALID.cause=%s webhook address no longer valid
WEBHOOK_REJECTED.cause=%s refused the webhook request (not authorised)
WEBHOOK_PAYLOAD_REJECTED.cause=%s rejected the message format
WEBHOOK_RATE_LIMITED.cause=%s asked to slow down (rate limit)
WEBHOOK_TIMEOUT.cause=%s did not answer in time
WEBHOOK_UNREACHABLE.cause=%s could not be reached
WEBHOOK_SERVER_ERROR.cause=%s had a temporary fault
WEBHOOK_UNEXPECTED_REPLY.cause=%s replied in an unexpected way
WEBHOOK_CONNECTOR_RETIRED.cause=The address is a retired Office 365 connector; use a Teams Workflows webhook
WEBHOOK_ADDRESS_NOT_SECURE.cause=%s webhook address must use https
DESTINATION_NOT_CONFIGURED.cause=No %s server or webhook is configured for the destination
SECRET_NOT_FOUND.cause=The %s secret is not in the secret store
SECRET_UNAVAILABLE.cause=The secret store could not be reached
DESTINATION_NOT_CONNECTED.cause=The destination is no longer connected for the tenant
CHANNEL_NOT_AVAILABLE.cause=No sender is installed for %s
NO_RECIPIENTS.cause=No one holds the recipient roles
RECIPIENTS_UNAVAILABLE.cause=The holders of the recipient roles could not be looked up
SENDER_FAILED.cause=The %s sender stopped with an unexpected fault
ACTION_REQUEST_CLOSED.cause=The request was decided or expired before the message went out
ACTION_LINKS_NOT_AVAILABLE.cause=No maker of approval links is installed
ACTION_KEY_NOT_FOUND.cause=The approval link key is not in the secret store
ACTION_KEY_INVALID.cause=The approval link key in the secret store is too short (at least 32 characters)
