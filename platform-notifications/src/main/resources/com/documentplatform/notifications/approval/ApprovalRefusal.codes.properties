# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.fix=Nothing for IT to do unless it repeats; then check the approval settings (platform.notifications.approvals.*) and the app's approvers.
*.support=The approval link could not be used; the message says why. A new request can be sent from the app.
KEY_UNAVAILABLE.kind=FAILED
KEY_UNAVAILABLE.fix=Check the secret store holds the approval link key under the name in platform.notifications.approvals.link-key-secret, and is reachable.
APPROVER_CHECK_UNAVAILABLE.kind=FAILED
APPROVER_CHECK_UNAVAILABLE.fix=Check the app's approver lookup (its user directory) is reachable.
REQUEST_EXPIRED.kind=INFO

# ---- per code
LINK_INVALID.cause=Tampered, malformed, made with another key, or for another tenant.
LINK_INVALID.message=This link is not valid.
LINK_NOT_FOR_YOU.cause=An e-mail link opened by someone signed in as another person.
LINK_NOT_FOR_YOU.message=This link was sent to someone else.
REQUEST_UNKNOWN.cause=This request no longer exists.
REQUEST_UNKNOWN.message=This request no longer exists.
OWN_REQUEST.cause=You cannot decide on your own request.
OWN_REQUEST.message=You cannot decide on your own request.
NOT_AN_APPROVER.cause=You do not hold the approver role for this request.
NOT_AN_APPROVER.message=You do not hold the approver role for this request.
