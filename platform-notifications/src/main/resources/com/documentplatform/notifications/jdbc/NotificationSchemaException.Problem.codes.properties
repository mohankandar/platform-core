# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=FAILED
*.message=The application cannot start: its database is not ready. IT has been told.
*.support=The app's database was not prepared for this release. Ask the customer's IT to run the schema step named in the app's log (the install guide says how), then start the app.
TABLES_MISSING.fix=Run the notifications schema step (Flyway location db/platform/notifications, in the app's own Flyway run) as the schema owner, then start the app.
TABLES_INCOMPLETE.fix=Restore the missing tables by running the notifications schema step again on a database where they exist, or restore the database; never create them by hand.
VERSION_UNKNOWN.fix=Check the notifications version table was not emptied or dropped; run the notifications schema step.
VERSION_UNKNOWN.cause=Some tables exist but the version table is missing or empty.
VERSION_OLDER.fix=Run the notifications schema step of this release (Flyway location db/platform/notifications, in the app's own Flyway run), then start the app.
VERSION_NEWER.fix=Install the app release that matches the database, or restore the database from before the upgrade.
PRIVILEGES_MISSING.fix=Grant the app's database user the rights the install guide lists on the notifications tables (SELECT, INSERT, UPDATE, DELETE; SELECT on the version table).
CHECK_FAILED.fix=Check the database is reachable and the app's user may read the system catalogue; the SQL state in the log says why the check was refused.
TABLES_MISSING.cause=None of the notifications tables exist: the schema step was never run on this database schema.
TABLES_INCOMPLETE.cause=The version is right but some notifications tables are missing.
VERSION_OLDER.cause=The notifications tables are older than the code: the schema step for this release was not run.
VERSION_NEWER.cause=The notifications tables are newer than the code: an older app release runs against an upgraded database.
PRIVILEGES_MISSING.cause=The app's database user may not read or write a notifications table.
CHECK_FAILED.cause=The database could not be reached, or refused the notifications check itself.

