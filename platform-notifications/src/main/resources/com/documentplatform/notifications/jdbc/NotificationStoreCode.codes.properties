# Texts of these platform codes (PlatformCode, platform-errors). Never a secret, token, document content or value.
NOTIF_STORE_FAILED.kind=FAILED
NOTIF_STORE_FAILED.message=The information could not be read or saved right now. Please try again later.
NOTIF_STORE_FAILED.cause=A read or write of the notifications tables failed: {operation} (SQL state {sqlState}).
NOTIF_STORE_FAILED.fix=Check the database is reachable and the app's database user has its rights on the notifications tables (docs/install/notifications.md); the SQL state says why.
NOTIF_STORE_FAILED.support=The app could not use its database; ask the customer's IT for the code, reference and SQL state.
