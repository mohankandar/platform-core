# Texts of these platform codes (PlatformCode, platform-errors). Never a secret, token, document content or value.
LIC_STORE_FAILED.kind=FAILED
LIC_STORE_FAILED.message=The information could not be read or saved right now. Please try again later.
LIC_STORE_FAILED.cause=A read or write of the licensing tables failed: {operation} (SQL state {sqlState}).
LIC_STORE_FAILED.fix=Check the database is reachable and the app's database user has its rights on the licensing tables (docs/install/licensing.md); the SQL state says why.
LIC_STORE_FAILED.support=The app could not use its database; ask the customer's IT for the code, reference and SQL state.
