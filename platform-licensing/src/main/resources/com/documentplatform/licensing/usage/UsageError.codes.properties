# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.message=The usage could not be recorded.
*.fix=Record usage only for slots and products of the licence in force, with amounts of zero or more; correct the app's call.
*.support=Internal app fault: the app recorded usage the licence does not know. Collect the reference for the product team.

# ---- per code
USAGE_UNKNOWN_SLOT.cause=The entity slot is not in the current licence.
USAGE_UNKNOWN_PRODUCT.cause=The product is not in the current licence.
USAGE_NEGATIVE_AMOUNT.cause=A usage amount cannot be below zero.
