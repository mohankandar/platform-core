# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=FAILED
*.message=The usage records could not be verified.
*.fix=Do not edit the usage tables. Restore the lic_ tables from the last backup that verifies, and tell your account manager the reference.
*.support=The customer's usage ledger does not verify (it was changed outside the app, or restored partly). Ask for the usage file and the reference; escalate to the licensing team.

# ---- per code
USAGE_CHAIN_RECORD_EDITED.cause=A record's content no longer matches its hash.
USAGE_CHAIN_LINK_BROKEN.cause=A record does not point to the hash of the one before it.
USAGE_CHAIN_SEQUENCE_GAP.cause=Sequence numbers are not 1, 2, 3, ...
USAGE_CHAIN_HEAD_MISMATCH.cause=The newest record does not match the stored chain head: the newest records (or the head) were removed or changed.
