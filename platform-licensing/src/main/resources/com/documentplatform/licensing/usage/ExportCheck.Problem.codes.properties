# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.message=The usage file does not verify.
*.fix=Export the usage file again with the licence command and send it as it is; never edit it.
*.support=The usage file a customer sent does not verify (edited, cut short, or another customer's). Ask them to export it again and send it unchanged.

# ---- per code
EXPORT_MALFORMED.cause=Not a readable usage export (bad JSON, missing or unknown fields).
EXPORT_UNSUPPORTED_FORMAT.cause=A format this version does not read.
EXPORT_START_MISMATCH.cause=The file does not start from the previous file's final chain value: a file is missing or was replaced.
EXPORT_SEQUENCE_GAP.cause=The sequence number is not the previous one plus 1: a file is missing or repeated.
EXPORT_PERIOD_GAP.cause=The first month is not the month after the previous file's last month: months are missing or overlap.
EXPORT_TENANT_MISMATCH.cause=The file belongs to a different tenant from the files before it.
EXPORT_HEADER_EDITED.cause=The header was changed after export.
EXPORT_RECORD_EDITED.cause=A record was changed, removed or inserted after export.
EXPORT_RECORD_OUTSIDE_PERIOD.cause=A record's month is outside the file's months.
EXPORT_FOOTER_MISMATCH.cause=The footer does not match the records (count or final value): records were removed at the end or the footer edited.
