# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.message=The product's licence cannot be used. Please contact your administrator.
*.support=The customer's licence was refused; the code says why. Ask their IT to store the licence file they received (licence command), or send a new licence.
*.fix=See the licensing install guide for this code.

# ---- per code
LICENCE_MISSING.cause=No licence is stored. Install the licence file you received with the setup or licence command.
LICENCE_MALFORMED.cause=The licence is not a readable licence file.
LICENCE_UNSUPPORTED_FORMAT.cause=The licence uses a format or signature algorithm this version does not read.
LICENCE_UNKNOWN_KEY_ID.cause=The licence is signed with a key this version does not know.
LICENCE_TAMPERED.cause=The licence content was changed after it was signed.
LICENCE_FORGED.cause=The licence signature was not made by the named key.
LICENCE_WRONG_CUSTOMER.cause=The licence belongs to a different customer (tenant) than this installation.
LICENCE_OLDER_VERSION.cause=The licence is an older version than one already stored.
LICENCE_VERSION_CONFLICT.cause=A different licence with the same version number is already stored.
