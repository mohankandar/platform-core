# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.message=The clock reset file cannot be used.
*.fix=Ask your account manager for a new signed last-seen reset file for this installation, and use it before it expires.
*.support=The customer's last-seen reset file was refused; issue a new one for their tenant (it is valid for a short time).

# ---- per code
RESET_MISSING.cause=No reset file was given.
RESET_MALFORMED.cause=The reset is not a readable reset file.
RESET_UNSUPPORTED_FORMAT.cause=The reset uses a format or signature algorithm this version does not read.
RESET_UNKNOWN_KEY_ID.cause=The reset is signed with a key this version does not know.
RESET_TAMPERED.cause=The reset content was changed after it was signed.
RESET_FORGED.cause=The reset signature was not made by the named key.
RESET_WRONG_CUSTOMER.cause=The reset was issued for a different customer (tenant) than this installation.
RESET_EXPIRED.cause=The reset is past its validity.
RESET_NEEDS_OWNER.cause=The database user may not move the latest time seen back; only the schema owner may.
RESET_NEEDS_OWNER.fix=Run licence apply-reset again with the schema owner's database user (the one the schema step uses).
RESET_NEEDS_OWNER.support=The reset file is fine; it was applied with the app's everyday database user. No new file is needed.
