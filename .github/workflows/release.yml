name: Release

on:
  push:
    tags:
      - 'platform-core-v*'

# Nothing by default; each job names only what it needs (P043, SEC-40).
permissions: {}

jobs:
  # Checks and tests with read rights only: a test or plugin can never reach a write token.
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # SEC-15: only a commit that is on main, and whose own CI run on main passed, is ever published.
      - name: The tagged commit is on main and its CI on main passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${GITHUB_SHA}" # on a tag push: the commit the tag points to
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${sha}" origin/main; then
            echo "The tag ${GITHUB_REF_NAME} points to ${sha}, which is not on main. Only commits merged into main through a pull request are released." >&2
            exit 1
          fi
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&branch=main&event=push&status=success&per_page=1" --jq '.total_count')"
          if [ "${runs}" -lt 1 ]; then
            echo "No successful CI run on main for ${sha}. Wait for main's CI on the merge commit to pass, then tag again with a new version." >&2
            exit 1
          fi
          echo "commit ${sha} is on main; CI on main passed"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: The POM version is the tag's, without -SNAPSHOT
        run: |
          tag="${GITHUB_REF_NAME}"
          want="${tag#platform-core-v}"
          have="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          echo "tag ${tag}, POM version ${have}"
          if [ "${have}" != "${want}" ]; then echo "POM version ${have} is not ${want}" >&2; exit 1; fi
          case "${have}" in *-SNAPSHOT) echo "a release has no -SNAPSHOT" >&2; exit 1;; esac
          if [ ! -f "docs/releases/${tag}.md" ]; then echo "docs/releases/${tag}.md is missing" >&2; exit 1; fi

      - name: mvn -B verify
        run: mvn -B verify

      - name: No test skipped
        run: scripts/ci-no-skipped-tests.sh

  # Publishing only, after verify passed, with the write rights it needs and no test run.
  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          # settings.xml with server "github" (distributionManagement), login from the job's token. No cache here:
          # the publishing job never restores what another job saved.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: mvn -B deploy
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "docs/releases/${GITHUB_REF_NAME}.md" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
