name: Install proof run

# The install proof's jobs, the same for every caller: install-proof.yml (by hand and monthly) and release.yml (candidates).
# Read rights only, so that the release workflow grants nothing more to call it (P053).
on:
  workflow_call:
    inputs:
      version:
        description: The published platform-core version
        type: string
        required: true
      ref:
        description: What to check out (the sample app and its guides); empty for the commit the workflow runs for
        type: string
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  proof:
    name: install proof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PLATFORM_VERSION: ${{ inputs.version }}
      VAULT_VERSION: 1.21.4
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }} # empty: the commit the workflow runs for
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          server-id: github-platform-core
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build the sample app from the published artifacts
        run: mvn -B -f examples/sample-app/pom.xml package "-Dplatform.version=${PLATFORM_VERSION}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The runner images carry PostgreSQL as the operating system's own package / installer.
      - name: PostgreSQL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "alter user postgres password 'root'"
          echo "DB_STOP=sudo systemctl stop postgresql" >> "$GITHUB_ENV"
          echo "DB_START=sudo systemctl start postgresql" >> "$GITHUB_ENV"

      - name: PostgreSQL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $s = Get-Service 'postgresql*' | Select-Object -First 1
          Set-Service $s.Name -StartupType Manual
          Start-Service $s.Name
          "$env:PGBIN" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "DB_STOP=net stop $($s.Name)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "DB_START=net start $($s.Name)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Vault binary, checked against its published checksum
        run: |
          os=linux; [ "$RUNNER_OS" = Windows ] && os=windows
          zip="vault_${VAULT_VERSION}_${os}_amd64.zip"
          mkdir -p "$RUNNER_TEMP/vault" && cd "$RUNNER_TEMP/vault"
          curl -fsSLO "https://releases.hashicorp.com/vault/${VAULT_VERSION}/${zip}"
          curl -fsSLO "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_SHA256SUMS"
          grep " ${zip}\$" "vault_${VAULT_VERSION}_SHA256SUMS" | sha256sum -c -
          unzip -q "$zip"
          if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$PWD" >> "$GITHUB_PATH"; else echo "$PWD" >> "$GITHUB_PATH"; fi

      - name: The install guides, step by step
        run: |
          export APP_JAR="$PWD/examples/sample-app/app/target/sample-app.jar" MOCKS_JAR="$PWD/examples/sample-app/mocks/target/sample-mocks.jar"
          bash examples/sample-app/install/install-proof.sh
