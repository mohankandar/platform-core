name: CI

on:
  push:
  pull_request:

# Read only (P043, SEC-40): CI never writes to the repository or its packages.
permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compile and all tests, including the PostgreSQL tests (Testcontainers, Docker on the runner), the end-to-end
      # TLS tests and the product-name guard.
      - name: mvn -B verify
        # The scanner tests use the real EICAR test file here (a placeholder by default; testkit Eicar).
        env:
          RUN_EICAR_TESTS: "true"
        run: mvn -B verify

      # On this runner nothing may be skipped: the TLS tests skip only where TLS to 127.0.0.1 is intercepted.
      - name: No test skipped
        if: always()
        run: scripts/ci-no-skipped-tests.sh
