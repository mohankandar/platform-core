# Texts of these platform codes (PlatformCode, platform-errors). Never a secret, token, document content or value.
LIC_SETTINGS_INVALID.kind=REFUSED
LIC_SETTINGS_INVALID.message=The application did not start: its licensing settings are not complete. IT has the details.
LIC_SETTINGS_INVALID.cause=A platform.licensing.* setting is missing or not valid, or a bean licensing needs is missing; the start-up message lists every problem.
LIC_SETTINGS_INVALID.fix=Correct each platform.licensing.* setting or add each bean the start-up message names (docs/install/licensing.md), then start the app again.
LIC_SETTINGS_INVALID.support=The app refuses to start until its licensing settings are complete; ask the customer's IT for the start-up message.
