# Texts of these platform codes (PlatformCode, platform-errors). Never a secret, token, document content or value.
INTEGRATION_SETTINGS_INVALID.kind=REFUSED
INTEGRATION_SETTINGS_INVALID.message=The application did not start: its integrations settings are not complete. IT has the details.
INTEGRATION_SETTINGS_INVALID.cause=A platform.integration.* setting is missing or not valid, or a bean integrations needs is missing; the start-up message lists every problem.
INTEGRATION_SETTINGS_INVALID.fix=Correct each platform.integration.* setting or add each bean the start-up message names (docs/install/integration.md), then start the app again.
INTEGRATION_SETTINGS_INVALID.support=The app refuses to start until its integrations settings are complete; ask the customer's IT for the start-up message.
