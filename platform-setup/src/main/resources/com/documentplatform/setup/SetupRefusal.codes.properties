# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.message=Setup did not run: the input needs correcting. Nothing was written.
*.support=Ask the customer's IT for setup's output (the first line names the code); the setup install guide says what to correct. Nothing was written to the database.
SETUP_DB_UNREACHABLE.kind=FAILED
SETUP_KEY_SERVICE_FAILED.kind=FAILED
SETUP_FAILED.kind=FAILED
SETUP_CONFIG_NOT_WRITTEN.kind=FAILED
SETUP_DB_UNREACHABLE.message=Setup could not reach the database. Nothing was written.
SETUP_KEY_SERVICE_FAILED.message=Setup could not use the key service. Nothing was written.
SETUP_FAILED.message=Setup stopped before it finished. Nothing was written.
SETUP_BAD_OPTION.cause=An option is unknown, given twice, or has no value.
SETUP_FILE_UNREADABLE.cause=An input file is missing or cannot be read.
SETUP_KEYS_INVALID.cause=The trusted-keys file is not a valid platform-licence-keys/1 file.
SETUP_LICENCE_REFUSED.cause=The licence file is refused (the licence code in the message says why).
SETUP_SIGNIN_INVALID.cause=The sign-in file is not a valid platform-signin/1 file.
SETUP_MODE_NOT_SUPPORTED.cause=The sign-in file asks for a sign-in mode this setup version does not support.
SETUP_WRONG_TENANT.cause=The sign-in file is for another customer than the licence.
SETUP_PRODUCT_NOT_IN_LICENCE.cause=The licence does not cover the product given with --product.
SETUP_PRODUCT_NOT_IN_SIGNIN.cause=The sign-in file has no section for the product given with --product.
SETUP_PRODUCT_ROLES_INVALID.cause=The product-roles file is not valid for the product (roles, aliases or customerKeys).
SETUP_MAPPING_INVALID.cause=The role mapping file has errors (each line is listed).
SETUP_DB_SETTINGS_MISSING.cause=The database settings (PLATFORM_SETUP_DB_*) are missing from the environment.
SETUP_DB_UNREACHABLE.cause=The database could not be reached or refused the login.
SETUP_TABLES_NOT_READY.cause=The platform tables are missing or at another version: the schema step was not run.
SETUP_OTHER_CUSTOMER_INSTALLED.cause=This database already holds another customer's licence or records.
SETUP_LICENCE_OLDER.cause=The licence file is older than the licence already stored.
SETUP_LICENCE_VERSION_CONFLICT.cause=A different licence with the same version number is already stored.
SETUP_CONFIG_OTHER_TENANT.cause=The config fragment already names the customer ID of another customer.

# ---- per code
SETUP_BAD_OPTION.fix=Correct the options; 'setup' without options lists them.
SETUP_FILE_UNREADABLE.fix=Check the path and that the file can be read.
SETUP_KEYS_INVALID.fix=Use the trusted-keys.json shipped with this release, unchanged.
SETUP_LICENCE_REFUSED.fix=Use the licence file you received, unchanged, with the trusted-keys.json of this release. A demo licence (development key) is never accepted by a production installation.
SETUP_SIGNIN_INVALID.fix=Correct the sign-in file (format platform-signin/1). It holds no secrets: client secrets are never written in it.
SETUP_TIME_ZONE_INVALID.cause=A time zone in the sign-in file is not an IANA name.
SETUP_TIME_ZONE_INVALID.fix=Write time zones as IANA names such as America/New_York or Europe/London (not offsets such as -05:00, which do not follow daylight saving).
SETUP_TIME_ZONE_SLOT_NOT_IN_LICENCE.cause=The sign-in file gives a time zone for an entity slot the licence does not list.
SETUP_TIME_ZONE_SLOT_NOT_IN_LICENCE.fix=Give time zones in entityTimeZones only for entity slots the licence lists.
SETUP_HTTP_ISSUER_NOT_ALLOWED.cause=The sign-in file's issuer is http: allowed only on localhost, 127.0.0.1 or [::1] with a licence signed by a development key.
SETUP_HTTP_ISSUER_NOT_ALLOWED.fix=Use the login system's https issuer address. An http issuer is accepted only for a local test login server (localhost, 127.0.0.1 or [::1]) with a demo or test licence signed by a development key.
SETUP_CUSTOMER_KEYS_REQUIRED.cause=The product's product-roles.json says customerKeys "required", and --no-customer-keys was given.
SETUP_CUSTOMER_KEYS_REQUIRED.fix=This product keeps sensitive values and needs the customer's keys: run setup without --no-customer-keys, with the key service settings in the environment.
SETUP_MODE_NOT_SUPPORTED.fix=This version sets up direct sign-in only (mode "direct").
SETUP_WRONG_TENANT.fix=The sign-in file must name the customer (tenantId) of the licence; use the sign-in file made for this customer.
SETUP_PRODUCT_NOT_IN_LICENCE.fix=Run setup for a product the licence lists, or ask for a licence that includes it.
SETUP_PRODUCT_NOT_IN_SIGNIN.fix=Add the product (browserClientId, apiAudience, roleMappingFile) to the sign-in file.
SETUP_PRODUCT_ROLES_INVALID.fix=Use the product-roles.json shipped with this product's release, for the product given with --product.
SETUP_PLATFORM_ROLE_ON_ENTITY.cause=A platform role on an entity row of the role mapping file (it goes on a row with entity_id *).
SETUP_PLATFORM_ROLE_ON_ENTITY.fix=Grant the platform role on a row with entity_id * (platform-wide for this customer and product), not on an entity's row. Nothing was written.
SETUP_ENTITY_ROLE_PLATFORM_WIDE.cause=An entity role on a row with entity_id * of the role mapping file (only platform roles are platform-wide).
SETUP_ENTITY_ROLE_PLATFORM_WIDE.fix=A row with entity_id * takes only the product's platformRoles; grant entity roles per entity slot (ENT-...). Nothing was written.
SETUP_MAPPING_INVALID.fix=Correct the role mapping file at the lines listed; nothing was written.
SETUP_CLIENT_BINDINGS_INVALID.cause=The client-binding file has errors (each with its line number and code), or a client is bound elsewhere.
SETUP_CLIENT_BINDINGS_INVALID.fix=Correct the client-binding file at the lines listed (header client_id,entity_slot,source,description; client IDs only, never secrets; each client ID once; entity slots of the licence; sources listed in the sign-in file). To move a client to another entity or source, remove its line, run setup, then add the new line. Nothing was written.
SETUP_PROFILE_INVALID.cause=An integration profile named in the sign-in file is not valid, or is not the profile the entry names.
SETUP_PROFILE_INVALID.fix=Use the integration profile file as its API's owner published it, for the name and release tag given in the sign-in file (the problems name the file and the place in it). Nothing was written.
SETUP_PROFILE_TAG_MISSING.cause=An integration profile entry in the sign-in file has no release tag.
SETUP_PROFILE_TAG_MISSING.fix=Give each integration profile in the sign-in file the API owner's release tag it came from ("tag"), so the installation records which release it uses.
SETUP_DB_SETTINGS_MISSING.fix=Set PLATFORM_SETUP_DB_URL, PLATFORM_SETUP_DB_USER and PLATFORM_SETUP_DB_PASSWORD in the environment (the app's everyday database user is enough).
SETUP_DB_UNREACHABLE.fix=Check the database address, user and password in the environment, and that the database is running.
SETUP_TABLES_NOT_READY.fix=Run the app's schema step for this release (licensing and identity tables) first; setup never creates tables.
SETUP_OTHER_CUSTOMER_INSTALLED.fix=This database holds another customer's records. Check that the database settings point to this customer's installation.
SETUP_LICENCE_OLDER.fix=A newer licence is already stored; use the newest licence file.
SETUP_LICENCE_VERSION_CONFLICT.fix=Another licence with the same version is already stored; ask us for the correct licence file.
SETUP_CONFIG_OTHER_TENANT.fix=The config fragment names another customer; check --config-out points to this installation's file.
SETUP_KEY_SERVICE_SETTINGS_MISSING.cause=No (or more than one) key service login, or no key service address.
SETUP_KEY_SERVICE_SETTINGS_MISSING.fix=Set PLATFORM_SETUP_VAULT_ADDR and one login (PLATFORM_SETUP_VAULT_TOKEN, PLATFORM_SETUP_VAULT_TOKEN_FILE, or PLATFORM_SETUP_VAULT_ROLE_ID with PLATFORM_SETUP_VAULT_SECRET_ID) with the platform-crypto-setup policy, in the environment of this run only; or run with --no-customer-keys if this installation keeps no sensitive values.
SETUP_KEY_SERVICE_FAILED.cause=The key service could not be reached, refused the login, or refused to read or create the keys.
SETUP_KEY_SERVICE_FAILED.fix=Check the key service address, the login and that its policy is platform-crypto-setup (the CRYPTO_ code names the cause), then run setup again. Nothing was changed in the database.
SETUP_FAILED.cause=The database part failed and was rolled back; nothing was changed.
SETUP_FAILED.fix=Nothing was changed in the database. Fix the cause and run setup again; it does the whole run.
SETUP_CONFIG_NOT_WRITTEN.cause=The database part was committed but the config fragment could not be written.
SETUP_CONFIG_NOT_WRITTEN.fix=The database part is done. Make the config fragment's folder writable and run setup again; it finishes what was missing.
