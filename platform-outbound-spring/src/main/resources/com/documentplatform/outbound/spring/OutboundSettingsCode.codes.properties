# Texts of these platform codes (PlatformCode, platform-errors). Never a secret, token, document content or value.
OUTBOUND_SETTINGS_INVALID.kind=REFUSED
OUTBOUND_SETTINGS_INVALID.message=The application did not start: its outbound calls settings are not complete. IT has the details.
OUTBOUND_SETTINGS_INVALID.cause=A platform.outbound.* setting is missing or not valid, or a bean outbound calls needs is missing; the start-up message lists every problem.
OUTBOUND_SETTINGS_INVALID.fix=Correct each platform.outbound.* setting or add each bean the start-up message names (docs/install/integration.md section 1), then start the app again.
OUTBOUND_SETTINGS_INVALID.support=The app refuses to start until its outbound calls settings are complete; ask the customer's IT for the start-up message.
