# Texts of these platform codes (PlatformCode, platform-errors). Never a secret, token, document content or value.
IDENTITY_PUSH_SETTINGS_INVALID.kind=REFUSED
IDENTITY_PUSH_SETTINGS_INVALID.message=The application did not start: its push-API caller settings are not complete. IT has the details.
IDENTITY_PUSH_SETTINGS_INVALID.cause=A platform.identity.push.* setting is missing or not valid, or a bean push-API caller needs is missing; the start-up message lists every problem.
IDENTITY_PUSH_SETTINGS_INVALID.fix=Correct each platform.identity.push.* setting or add each bean the start-up message names (docs/install/identity.md), then start the app again.
IDENTITY_PUSH_SETTINGS_INVALID.support=The app refuses to start until its push-API caller settings are complete; ask the customer's IT for the start-up message.
