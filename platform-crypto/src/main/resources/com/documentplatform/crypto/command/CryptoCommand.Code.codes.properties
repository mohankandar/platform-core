# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=REFUSED
*.message=The key destruction did not run. Nothing was destroyed.
*.fix=Follow the message: run crypto destroy-customer-keys with --tenant-id and the tenant ID typed back exactly (--confirm) (docs/design/crypto.md).
*.support=Customer exit: the key destruction command refused; nothing was destroyed. The operator corrects the command and runs it again.
CRYPTO_COMMAND_USAGE.cause=The command was called with unknown or missing options.
CRYPTO_DESTROY_RESULT_FILE.kind=FAILED
CRYPTO_DESTROY_RESULT_FILE.fix=Give a result file path the account may write that does not exist yet.
CRYPTO_DESTROY_NO_KEYS.kind=INFO
CRYPTO_DESTROY_NO_KEYS.fix=Nothing to do: the customer has no keys in the key service (already destroyed, or never created).

# ---- per code
CRYPTO_DESTROY_NOT_CONFIRMED.cause=No confirmation was typed. Nothing was destroyed.
CRYPTO_DESTROY_CONFIRMATION_WRONG.cause=The confirmation is not the tenant ID given. Nothing was destroyed.
CRYPTO_DESTROY_RESULT_FILE.cause=The result file already exists, or cannot be created. Nothing was destroyed.
CRYPTO_DESTROY_NO_KEYS.cause=The key service has neither of the customer's keys (wrong tenant ID or prefix, or already destroyed).
