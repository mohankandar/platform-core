# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=FAILED
*.message=Protected information cannot be read or saved right now. IT has been told.
*.fix=Check the key service (Vault): reachable at platform.crypto.vault.address, unsealed, the app's login and its policy on the customer's keys (docs/install/crypto.md); its health shows the code.
*.support=The app cannot use the customer's key service. Ask the customer's IT for the code and reference; the crypto install guide says what each code means.
CRYPTO_SETTINGS_INVALID.kind=REFUSED
CRYPTO_SETTINGS_INVALID.fix=Correct the platform.crypto.* settings named in the message.
CRYPTO_LOGIN_REFUSED.fix=Check the app's Vault login (AppRole role and secret ID, or token) is valid and not expired.
CRYPTO_PERMISSION_DENIED.fix=Grant the app's Vault policy encrypt, decrypt and hmac on the customer's Transit keys.
CRYPTO_KEY_MISSING.fix=Run the setup command, which creates the customer's keys in the key service.
CRYPTO_KEY_DISABLED.fix=Ask the key service's admin why the customer's key is disabled; re-enable it if the customer is still active.
CRYPTO_WRONG_CUSTOMER.kind=REFUSED
CRYPTO_WRONG_CUSTOMER.fix=App fault or data from another installation: data sealed for another customer cannot be opened here.
CRYPTO_CIPHERTEXT_INVALID.fix=The stored value was changed or cut; restore it from a backup.
CRYPTO_FORMAT_UNKNOWN.fix=Install the app release that wrote the value, or restore it from a backup.
CRYPTO_SECRET_MISSING.fix=Create the Vault login secret named in platform.crypto.* (token file or AppRole secret ID).

# ---- per code
CRYPTO_SETTINGS_INVALID.cause=A setting is missing or not valid (address, mount, key prefix, login). The message names the setting.
CRYPTO_KEY_SERVICE_UNREACHABLE.cause=The key service does not answer: connection refused, no route, timeout.
CRYPTO_KEY_SERVICE_TLS.cause=The TLS handshake with the key service failed (usually its CA is not in the Java trust store).
CRYPTO_KEY_SERVICE_SEALED.cause=The key service is sealed or not ready (Vault: HTTP 503).
CRYPTO_LOGIN_REFUSED.cause=The login to the key service was refused (wrong AppRole role or secret ID, empty token file).
CRYPTO_PERMISSION_DENIED.cause=The key service refused the call: the token or its policy does not allow it (Vault: HTTP 401/403).
CRYPTO_KEY_MISSING.cause=The customer's key does not exist in the key service (not created by the set-up step, or deleted).
CRYPTO_KEY_DISABLED.cause=The key, or the key version the data was protected with, is switched off (Vault: below the key's min_decryption_version; KMS / Key Vault: a disabled key). Rewrap the data while the version is usable.
CRYPTO_KEY_SERVICE_ERROR.cause=The key service answered with something else that is not usable.
CRYPTO_SECRET_MISSING.cause=A secret asked for does not exist (Vault KV: no such path).
CRYPTO_WRONG_CUSTOMER.cause=The data belongs to another customer than the one asked for. Refused before any key is used.
CRYPTO_KEY_SERVICE_MISMATCH.cause=The data was protected by another key service than the one configured.
CRYPTO_CIPHERTEXT_INVALID.cause=The ciphertext was changed, cut short, or does not belong with its context: authentication failed.
CRYPTO_FORMAT_UNKNOWN.cause=Not data of a format this library knows (wrong prefix, unknown version).
