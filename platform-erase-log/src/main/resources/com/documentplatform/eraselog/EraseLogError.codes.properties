# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=FAILED
*.message=The erase could not be done now. Nothing was erased; it is tried again.
*.fix=Check the erase log location (platform.erase-log.location) is reachable and writable, and follow docs/install/erase-log.md for the code.
*.support=The customer's erase log needs attention; ask their IT for the code and reference. After a database restore the app stays blocked until the erase replay has run.
ERASE_ENTRY_INVALID.kind=REFUSED
ERASE_ENTRY_INVALID.fix=App fault: correct the erase request (entity, product, record type and ID, kind).
ERASE_ENTRY_VALUE_REFUSED.kind=REFUSED
ERASE_ENTRY_VALUE_REFUSED.fix=App fault: an erase request may hold IDs only, never a value; correct the app's call.
ERASE_LOG_SETTINGS_INVALID.kind=REFUSED
ERASE_LOG_SETTINGS_INVALID.fix=Correct the platform.erase-log.* settings named in the message.
ERASE_LOG_RESTORE_DETECTED.message=The application is paused while a restored database is brought up to date.
ERASE_LOG_RESTORE_DETECTED.fix=Run the erase replay (start the app once with --erase-replay); the app then lifts the block.
ERASE_LOG_CHAIN_BROKEN.fix=Do not edit the erase log. Restore it from its own backup; contact support with the reference.
ERASE_HANDLER_MISSING.fix=App fault: the app has no erase handler for the entry's kind; install the app release that has it.
ERASE_HANDLER_ERROR.fix=App fault: the handler named in the message failed unexpectedly; nothing was marked erased and it is tried again. Install the app release that fixes the handler, then run the erase replay if the app is blocked.

# ---- per code
ERASE_ENTRY_INVALID.cause=A field of an entry is missing or not of its form (the message names the field, not what was given).
ERASE_ENTRY_VALUE_REFUSED.cause=A field of an entry looks like a value (an e-mail address, sealed data, a fingerprint): the log holds no values.
ERASE_LOG_SETTINGS_INVALID.cause=A setting is missing or not valid (location, backup retention).
ERASE_LOG_UNREACHABLE.cause=The log's location cannot be read or written (not mounted, no rights, disk full).
ERASE_LOG_FORMAT.cause=A line of the log is not an entry of a known format.
ERASE_LOG_CHAIN_BROKEN.cause=An entry was changed, removed or put out of order: its hash does not follow from the one before.
ERASE_LOG_RESTORE_DETECTED.cause=The database is behind the log: it was restored from a backup (or stopped between writing an entry and erasing). "Restored from backup: run the erase replay before starting work."
ERASE_LOG_BEHIND_DATABASE.cause=The database has applied entries the log does not have: the log lost entries, or it is not this database's log.
ERASE_LOG_WRONG_LOG.cause=The database's applied position belongs to another log, or its entry's hash differs from this log's.
ERASE_LOG_GAP.cause=The database is older than the log's oldest kept entry (pruned): the erasures in between cannot be replayed.
ERASE_POSITION_FAILED.cause=The applied position in the app's database cannot be read or written.
ERASE_HANDLER_MISSING.cause=No handler is registered for an entry's kind.
ERASE_HANDLER_FAILED.cause=A handler refused or failed; the message carries the handler's own code.
ERASE_HANDLER_ERROR.cause=The {kind} handler threw an unexpected exception (its type is named, never its text).
ERASE_VERIFY_FAILED.cause=After the replay, a handler found something in the log still readable (or could not check).
