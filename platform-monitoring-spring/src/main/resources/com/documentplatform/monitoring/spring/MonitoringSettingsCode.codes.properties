# Texts of these platform codes (PlatformCode, platform-errors). Never a secret, token, document content or value.
MON_SETTINGS_INVALID.kind=REFUSED
MON_SETTINGS_INVALID.message=The application did not start: its monitoring settings are not complete. IT has the details.
MON_SETTINGS_INVALID.cause=A platform.monitoring.* setting is missing or not valid, or a bean monitoring needs is missing; the start-up message lists every problem.
MON_SETTINGS_INVALID.fix=Correct each platform.monitoring.* setting or add each bean the start-up message names (docs/install/monitoring.md), then start the app again.
MON_SETTINGS_INVALID.support=The app refuses to start until its monitoring settings are complete; ask the customer's IT for the start-up message.
