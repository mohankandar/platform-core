# Texts of the monitoring codes (PlatformCode, platform-errors). Never a secret, token, document content or value.
*.kind=FAILED
*.message=A service the application needs is not working properly. IT has been told.
*.support=Ask the customer's IT to open the Support screen (dependency list) or send the diagnostic bundle; each line names the code, the cause and the fix (docs/install/monitoring.md).

MON_WORKING.kind=INFO
MON_WORKING.message=Working.
MON_WORKING.cause=The check got the answer it expects.
MON_WORKING.fix=Nothing to do.

MON_CHECK_FAILED.cause=The check {check} could not run: {error}.
MON_CHECK_FAILED.fix=Look up the check in docs/install/monitoring.md; the log line with the same time has more. If the check is the app's own, its owner fixes it.
MON_CHECK_TIMEOUT.cause=The check {check} did not answer within {timeout}.
MON_CHECK_TIMEOUT.fix=Check the dependency is reachable from this server and not overloaded; a check that hangs counts as down.

MON_DB_UNREACHABLE.cause=The database {database} cannot be reached (SQL state {sqlState}).
MON_DB_UNREACHABLE.fix=Check the database is running, its address and port in the app's DataSource settings, and the firewall between them.
MON_DB_LOGIN_REFUSED.cause=The database {database} refused the app's login (SQL state {sqlState}).
MON_DB_LOGIN_REFUSED.fix=Check the app's database user and its password (in the secret store) and that the user may connect.

MON_KEY_SERVICE_DOWN.cause=The key service {keyService} does not answer as expected.
MON_KEY_SERVICE_DOWN.fix=Check the key service (Vault) is reachable, unsealed and the app's login valid (docs/install/crypto.md).

MON_SECRET_MISSING.kind=FAILED
MON_SECRET_MISSING.cause=The secret {secretRef} is not in the secret store.
MON_SECRET_MISSING.fix=Create the secret under that name in the secret store, or correct the name in the app's settings.
MON_SECRET_UNAVAILABLE.cause=The secret store could not be read for {secretRef}.
MON_SECRET_UNAVAILABLE.fix=Check the secret store is reachable and the app's account may read the secret.

MON_LOGIN_NO_CONNECTION.cause=There is no active login connection for {product}: nobody can sign in through it.
MON_LOGIN_NO_CONNECTION.fix=Run the setup command, or activate a validated login connection on the IT Admin's screen.

MON_LICENCE_NOT_STARTED.cause=The licence starts on {startsOn}; it is not valid yet.
MON_LICENCE_NOT_STARTED.fix=Wait for the start date, or store a licence that has started (licence command).
MON_LICENCE_EXPIRING.cause=The licence ends on {expiresOn}, in {days} days.
MON_LICENCE_EXPIRING.fix=Ask your account manager for the renewed licence and store it with the licence command before that date.
MON_LICENCE_IN_GRACE.cause=The licence ended on {expiresOn}; {days} days of grace are left.
MON_LICENCE_IN_GRACE.fix=Store the renewed licence now with the licence command; after the grace period new work is no longer taken in.
MON_LICENCE_EXPIRED.cause=The licence ended on {expiresOn} and its grace period is over.
MON_LICENCE_EXPIRED.fix=Store a renewed licence with the licence command; ask your account manager for one.

MON_CHANNEL_SETTINGS_INCOMPLETE.kind=REFUSED
MON_CHANNEL_SETTINGS_INCOMPLETE.cause=The {channel} channel is missing the setting {setting}.
MON_CHANNEL_SETTINGS_INCOMPLETE.fix=Complete the channel's settings in the install config or the notification settings.
MON_CHANNEL_ADDRESS_INVALID.kind=REFUSED
MON_CHANNEL_ADDRESS_INVALID.cause=The {channel} channel's address {address} is not a usable https address.
MON_CHANNEL_ADDRESS_INVALID.fix=Copy the channel's webhook address again from Teams or Slack.
MON_CHANNEL_UNREACHABLE.cause=The {channel} channel's server {address} cannot be reached from this server.
MON_CHANNEL_UNREACHABLE.fix=Check the server's address and port, and the firewall and proxy between them. Nothing was sent.

MON_PATH_MISSING.cause=The folder {path} ({location}) does not exist.
MON_PATH_MISSING.fix=Create the folder, or correct its path in the app's settings; check a share is mounted.
MON_PATH_NOT_READABLE.cause=The app's service account may not read the folder {path} ({location}).
MON_PATH_NOT_READABLE.fix=Give the app's service account read rights on the folder.
MON_PATH_NOT_WRITABLE.cause=The app's service account may not write to the folder {path} ({location}).
MON_PATH_NOT_WRITABLE.fix=Give the app's service account write rights on the folder.
MON_DISK_ALMOST_FULL.cause=The disk of {path} ({location}) is {used}% full (warning at {warnAt}%).
MON_DISK_ALMOST_FULL.fix=Free space on the disk, or move the folder to a larger one, before it is full.
MON_DISK_FULL.cause=The disk of {path} ({location}) is {used}% full (down at {downAt}%).
MON_DISK_FULL.fix=Free space on the disk now, or move the folder to a larger one.

MON_HTTP_ADDRESS_INVALID.kind=REFUSED
MON_HTTP_ADDRESS_INVALID.cause=The address of {service} is not an absolute http(s) address: {address}.
MON_HTTP_ADDRESS_INVALID.fix=Correct the service's address in the app's settings.
MON_HTTP_UNREACHABLE.cause=The service {service} at {address} cannot be reached.
MON_HTTP_UNREACHABLE.fix=Check the service is running, its address, and the firewall between this server and it.
MON_HTTP_TIMEOUT.cause=The service {service} at {address} did not answer within {timeout}.
MON_HTTP_TIMEOUT.fix=Check the service is not overloaded; restart it if it hangs.
MON_HTTP_UNEXPECTED_ANSWER.cause=The service {service} answered {status} at {address}; {expected} was expected.
MON_HTTP_UNEXPECTED_ANSWER.fix=Check the service's health path and its own log; restart it if it reports a fault.

MON_BUNDLE_TOO_LARGE.kind=REFUSED
MON_BUNDLE_TOO_LARGE.cause=The diagnostic bundle would be larger than {limit}; the last entries were left out.
MON_BUNDLE_TOO_LARGE.fix=Send the bundle as it is; ask support whether a larger one is needed.
