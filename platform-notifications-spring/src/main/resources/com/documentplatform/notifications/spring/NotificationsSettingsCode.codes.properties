# Texts of these platform codes (PlatformCode, platform-errors). Never a secret, token, document content or value.
NOTIF_SETTINGS_INVALID.kind=REFUSED
NOTIF_SETTINGS_INVALID.message=The application did not start: its notifications settings are not complete. IT has the details.
NOTIF_SETTINGS_INVALID.cause=A platform.notifications.* setting is missing or not valid, or a bean notifications needs is missing; the start-up message lists every problem.
NOTIF_SETTINGS_INVALID.fix=Correct each platform.notifications.* setting or add each bean the start-up message names (docs/install/notifications.md), then start the app again.
NOTIF_SETTINGS_INVALID.support=The app refuses to start until its notifications settings are complete; ask the customer's IT for the start-up message.
