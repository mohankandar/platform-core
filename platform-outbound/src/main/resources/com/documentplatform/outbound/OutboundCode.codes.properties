# Texts of these platform codes (PlatformCode, platform-errors). Generated from the code's own
# documentation, then completed by hand. Never a secret, token, document content or field value.
*.kind=FAILED
*.message=The other system could not be reached this time. IT has the details.
*.fix=Check the address, that the other system is running, and the network between them (firewall, platform.outbound.proxy.*, platform.outbound.private-ca-file).
*.support=Ask the customer's IT for the code and reference; the integrations install guide says what each outbound code means.
OUT_ADDRESS_BLOCKED.kind=REFUSED
OUT_ADDRESS_BLOCKED.fix=Use an allowed address. On premises, internal addresses need platform.outbound.allow-internal-addresses=true; cloud metadata and link-local addresses are always refused.
OUT_ADDRESS_NOT_SECURE.kind=REFUSED
OUT_ADDRESS_NOT_SECURE.fix=Use the https address; plain http is allowed only on premises with platform.outbound.allow-internal-addresses=true.
OUT_VALUE_NOT_ALLOWED.kind=REFUSED
OUT_VALUE_NOT_ALLOWED.fix=Remove the header the HTTP layer sets itself, or the control characters in the header value.
OUT_HOST_UNKNOWN.fix=Check the host name and this server's name service (DNS).
OUT_TLS_FAILED.fix=Check the other side's certificate: trusted by this server (your private CA in platform.outbound.private-ca-file), not expired, and naming the host.
OUT_TIMEOUT.fix=Check the other system's response time; raise the read timeout only if it is known to be slow.
OUT_SECRET_NOT_FOUND.fix=Create the proxy password in the secret store under the name in platform.outbound.proxy.password-secret, or correct the name.
OUT_SECRET_UNAVAILABLE.fix=Check the secret store is reachable and the app's account may read it.

# ---- per code
OUT_CANT_CONNECT.cause=Could not connect (refused, unreachable, or the address cannot be used).
OUT_HOST_UNKNOWN.cause=The host name is not known.
OUT_CONNECT_TIMEOUT.cause=The connection could not be opened within the connect timeout.
OUT_TIMEOUT.cause=No answer within the read timeout. The request may have arrived.
OUT_CONNECTION_LOST.cause=The connection was lost before a full answer was read.
OUT_TLS_FAILED.cause=The TLS handshake failed: certificate not trusted, host name not in the certificate, protocol refused.
OUT_ADDRESS_BLOCKED.cause=The address resolves to a blocked address (cloud metadata, link-local; internal unless allowed).
OUT_ADDRESS_NOT_SECURE.cause=The address is not https and plain http is not allowed for this installation.
OUT_PROXY_REFUSED.cause=The outbound proxy refused the connection.
OUT_PROXY_SIGN_IN_REFUSED.cause=The outbound proxy refused the sign-in (407).
OUT_PROXY_SIGN_IN_REFUSED.fix=The outbound proxy refused the sign-in (407). Check the proxy user and the password in the secret store (platform.outbound.proxy.user, platform.outbound.proxy.password-secret).
OUT_CREDENTIAL_REFUSED.cause=The other side refused the client certificate (a TLS alert: bad, unknown, expired or revoked certificate).
OUT_CREDENTIAL_REFUSED.fix=The destination refused the client certificate. Check with its owner that they trust this certificate (subject, issuer and fingerprint as shown) and that it is not revoked.
OUT_SECRET_NOT_FOUND.cause=The proxy password's reference names nothing in the secret store.
OUT_SECRET_UNAVAILABLE.cause=The secret store could not be read.
OUT_VALUE_NOT_ALLOWED.cause=A header the HTTP layer sets itself, or a header value with control characters.
